    function getFileExt(filename = '') {
      const parts = String(filename).split('.');
      return parts.length > 1 ? parts.pop().toLowerCase() : '';
    }

    function formatBytes(bytes) {
      const b = Number(bytes) || 0;
      if (b === 0) return '0 B';
      const k = 1024;
      const sizes = ['B', 'KB', 'MB', 'GB'];
      const i = Math.floor(Math.log(b) / Math.log(k));
      return `${parseFloat((b / Math.pow(k, i)).toFixed(2))} ${sizes[i]}`;
    }

    function readFileAsDataUrl(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = () => reject(reader.error);
        reader.readAsDataURL(file);
      });
    }

    // ========================================================================
    // SUPABASE CLOUD CONFIGURATION (REPLACE WITH YOUR PROJECT URL & ANON KEY)
    // ========================================================================
const SUPABASE_CONFIG = {
  url: "https://hwotboszxjvqdmpsgmqg.supabase.co",
  anonKey: "sb_publishable_n3vdmzkxVOdRYfmygzXJMQ_qZ9e5YHy",

    const isSupabaseConfigured = () =>

    // ========================================================================
    // WEBTREX CLOUD DATABASE & STORAGE ENGINE (SUPABASE + LOCAL FALLBACK)
    // ========================================================================
    const DB_NAME = 'WebTrexCloudDB';

    const WebTrexDB = (() => {
      const cache = new Map();
      let hydrated = false;
      let cloudStatus = supabaseClient ? 'connecting' : 'unconfigured';

      function getCloudStatus() {
        return cloudStatus;
      }

      async function uploadBinaryToCloud(fileObj) {
        if (!supabaseClient || !fileObj?.dataUrl || !fileObj.dataUrl.startsWith('data:')) {
          return fileObj;
        }
        try {
          const res = await fetch(fileObj.dataUrl);
          const blob = await res.blob();
          const safeName = `${Date.now()}-${Math.random().toString(36).slice(2, 7)}-${(fileObj.name || 'asset').replace(/[^a-zA-Z0-9._-]/g, '_')}`;
          const filePath = `releases/${safeName}`;

          const { error: uploadError } = await supabaseClient.storage
            .from(SUPABASE_CONFIG.storageBucket)
            .upload(filePath, blob, {
              contentType: blob.type || 'application/octet-stream',
              upsert: true,
            });

          if (uploadError) {
            console.warn('Supabase Storage upload warning (falling back to inline):', uploadError.message);
            return fileObj;
          }

          const { data: publicData } = supabaseClient.storage
            .from(SUPABASE_CONFIG.storageBucket)
            .getPublicUrl(filePath);

          if (publicData?.publicUrl) {
            return {
              ...fileObj,
              dataUrl: publicData.publicUrl,
              storagePath: filePath,
              cloudHosted: true,
            };
          }
        } catch (err) {
          console.warn('Binary upload fallback:', err);
        }
        return fileObj;
      }

      async function uploadDataUrlImageToCloud(dataUrl, label = 'image') {
        if (!supabaseClient || !dataUrl || !dataUrl.startsWith('data:image/')) {
          return dataUrl;
        }
        if (dataUrl.startsWith('data:image/svg+xml')) {
          return dataUrl;
        }
        try {
          const res = await fetch(dataUrl);
          const blob = await res.blob();
          const ext = (blob.type.split('/')[1] || 'png').replace('jpeg', 'jpg');
          const filePath = `images/${Date.now()}-${Math.random().toString(36).slice(2, 7)}-${label}.${ext}`;

          const { error } = await supabaseClient.storage
            .from(SUPABASE_CONFIG.storageBucket)
            .upload(filePath, blob, {
              contentType: blob.type,
              upsert: true,
            });

          if (!error) {
            const { data } = supabaseClient.storage
              .from(SUPABASE_CONFIG.storageBucket)
              .getPublicUrl(filePath);
            if (data?.publicUrl) return data.publicUrl;
          }
        } catch (err) {
          console.warn('Image upload fallback:', err);
        }
        return dataUrl;
      }

      async function hydrate() {
        if (!supabaseClient) {
          cloudStatus = 'unconfigured';
          hydrated = true;
          return;
        }
        try {
          const { data, error } = await supabaseClient
            .from(SUPABASE_CONFIG.tableName)
            .select('key, value');

          if (error) {
            console.warn('Supabase read error:', error.message);
            cloudStatus = 'error';
            hydrated = true;
            return;
          }

          (data || []).forEach((row) => {
            cache.set(row.key, row.value);
            try {
              localStorage.setItem(row.key, JSON.stringify(row.value));
            } catch (e) {}
          });

          cloudStatus = 'connected';
          hydrated = true;
          window.dispatchEvent(new CustomEvent('webtrex_storage_sync', { detail: { key: 'ALL_HYDRATED' } }));
        } catch (e) {
          cloudStatus = 'error';
          hydrated = true;
        }
      }

      function subscribeRealtime() {
        if (!supabaseClient) return null;
        const channel = supabaseClient
          .channel('webtrex-realtime-sync')
          .on(
            'postgres_changes',
            { event: '*', schema: 'public', table: SUPABASE_CONFIG.tableName },
            (payload) => {
              if (payload?.new?.key) {
                cache.set(payload.new.key, payload.new.value);
                try {
                  localStorage.setItem(payload.new.key, JSON.stringify(payload.new.value));
                } catch (e) {}
                window.dispatchEvent(
                  new CustomEvent('webtrex_storage_sync', { detail: { key: payload.new.key } })
                );
              }
            }
          )
          .subscribe();
        return channel;
      }

      async function persistToCloud(key, value) {
        if (!supabaseClient) return false;
        try {
          const { error } = await supabaseClient
            .from(SUPABASE_CONFIG.tableName)
            .upsert(
              { key, value, updated_at: new Date().toISOString() },
              { onConflict: 'key' }
            );
          if (error) {
            console.error('Supabase upsert error:', error.message);
            cloudStatus = 'error';
            return false;
          }
          cloudStatus = 'connected';
          return true;
        } catch (e) {
          cloudStatus = 'error';
          return false;
        }
      }

      async function exportBackupJson() {
        await hydrate();
        const dump = {
          database: DB_NAME,
          exportedAt: new Date().toISOString(),
          collections: {},
        };
        Object.values(STORAGE_KEYS).forEach((k) => {
          if (k !== STORAGE_KEYS.ADMIN) {
            dump.collections[k] = Store.read(k, null);
          }
        });
        return JSON.stringify(dump, null, 2);
      }

      async function importBackupJson(jsonString) {
        const parsed = JSON.parse(jsonString);
        const cols = parsed?.collections || parsed;
        if (!cols || typeof cols !== 'object') {
          throw new Error('Invalid WebTrex database backup format.');
        }
        for (const [key, val] of Object.entries(cols)) {
          if (Object.values(STORAGE_KEYS).includes(key) && key !== STORAGE_KEYS.ADMIN && val !== null) {
            Store.write(key, val);
          }
        }
      }

      return {
        hydrate,
        subscribeRealtime,
        persistToCloud,
        uploadBinaryToCloud,
        uploadDataUrlImageToCloud,
        exportBackupJson,
        importBackupJson,
        getCloudStatus,
        getCache: (key) => cache.get(key),
        hasCache: (key) => cache.has(key),
        setCache: (key, val) => cache.set(key, val),
        isHydrated: () => hydrated,
      };
    })();

    const INITIAL_ADMIN_EMAIL = 'webtrex@gmail.com';
    const HASH_SALT_PREFIX = 'WEBTREX_CORE_SALT_2026_V1::';

    function sha256PureJs(ascii) {
      function rightRotate(value, amount) {
        return (value >>> amount) | (value << (32 - amount));
      }
      const mathPow = Math.pow;
      const maxWord = mathPow(2, 32);
      let result = '';
      const words = [];
      const asciiBitLength = ascii.length * 8;
      const hash = [];
      const k = [];
      let primeCounter = 0;
      const isComposite = {};

      for (let candidate = 2; primeCounter < 64; candidate++) {
        if (!isComposite[candidate]) {
          for (let i = 0; i < 313; i += candidate) {
            isComposite[i] = candidate;
          }
          hash[primeCounter] = (mathPow(candidate, 0.5) * maxWord) | 0;
          k[primeCounter++] = (mathPow(candidate, 1 / 3) * maxWord) | 0;
        }
      }

      ascii += '\x80';
      while ((ascii.length % 64) - 56) ascii += '\x00';
      for (let i = 0; i < ascii.length; i++) {
        const j = ascii.charCodeAt(i);
        words[i >> 2] |= j << (((3 - i) % 4) * 8);
      }
      words[words.length] = (asciiBitLength / maxWord) | 0;
      words[words.length] = asciiBitLength;

      for (let j = 0; j < words.length; ) {
        const w = words.slice(j, (j += 16));
        const oldHash = hash.slice(0);
        for (let i = 0; i < 64; i++) {
          const w15 = w[i - 15];
          const w2 = w[i - 2];
          const a = hash[0];
          const e = hash[4];
          const temp1 =
            hash[7] +
            (rightRotate(e, 6) ^ rightRotate(e, 11) ^ rightRotate(e, 25)) +
            ((e & hash[5]) ^ (~e & hash[6])) +
            k[i] +
            (w[i] =
              i < 16
                ? w[i]
                : (w[i - 16] +
                    (rightRotate(w15, 7) ^ rightRotate(w15, 18) ^ (w15 >>> 3)) +
                    w[i - 7] +
                    (rightRotate(w2, 17) ^ rightRotate(w2, 19) ^ (w2 >>> 10))) |
                  0);
          const temp2 =
            (rightRotate(a, 2) ^ rightRotate(a, 13) ^ rightRotate(a, 22)) +
            ((a & hash[1]) ^ (a & hash[2]) ^ (hash[1] & hash[2]));
          hash.unshift((temp1 + temp2) | 0);
          hash[4] = (hash[4] + temp1) | 0;
          hash.pop();
        }
        for (let i = 0; i < 8; i++) {
          hash[i] = (hash[i] + oldHash[i]) | 0;
        }
      }

      for (let i = 0; i < 8; i++) {
        for (let j = 3; j + 1; j--) {
          const b = (hash[i] >> (j * 8)) & 255;
          result += (b < 16 ? '0' : '') + b.toString(16);
        }
      }
      return result;
    }

    function utf8Encode(str) {
      return unescape(encodeURIComponent(str));
    }

    async function computeSaltedHash(plainText, customSalt = null) {
      const normalized = String(plainText || '');
      const payload = customSalt
        ? `${customSalt}::${normalized}`
        : `${HASH_SALT_PREFIX}${normalized}`;
      try {
        if (typeof window !== 'undefined' && window.crypto && window.crypto.subtle) {
          const encoder = new TextEncoder();
          const data = encoder.encode(payload);
          const hashBuffer = await window.crypto.subtle.digest('SHA-256', data);
          const hashArray = Array.from(new Uint8Array(hashBuffer));
          return hashArray.map((b) => b.toString(16).padStart(2, '0')).join('');
        }
      } catch (err) {}
      return sha256PureJs(utf8Encode(payload));
    }

    async function getExpectedDefaultHash() {
      const defaultSeed = String.fromCharCode(64, 122, 97, 104, 114, 97, 110, 53, 52, 51, 52);
      return computeSaltedHash(defaultSeed);
    }

    // ========================================================================
    // HYBRID INDEXEDDB + LOCALSTORAGE PERSISTENCE ADAPTER
    // ========================================================================
    const STORAGE_KEYS = {
      PROJECTS: 'webtrex_cms_projects_v1',
      CATEGORIES: 'webtrex_cms_categories_v1',
      FILES: 'webtrex_cms_files_v1',
      MESSAGES: 'webtrex_cms_messages_v1',
      LOGS: 'webtrex_cms_logs_v1',
      SETTINGS: 'webtrex_cms_settings_v1',
      ADMIN: 'webtrex_cms_admin_v1',
    };

    const Store = {
      has(key) {
        if (WebTrexDB.hasCache(key)) return true;
        try {
          return localStorage.getItem(key) !== null;
        } catch (e) {
          return false;
        }
      },
      read(key, fallback) {
        if (WebTrexDB.hasCache(key)) {
          return WebTrexDB.getCache(key);
        }
        try {
          const raw = localStorage.getItem(key);
          if (raw) {
            const parsed = JSON.parse(raw);
            WebTrexDB.setCache(key, parsed);
            return parsed;
          }
          return fallback;
        } catch (e) {
          return fallback;
        }
      },
      write(key, value) {
        WebTrexDB.setCache(key, value);
        WebTrexDB.persistToCloud(key, value);
        try {
          localStorage.setItem(key, JSON.stringify(value));
        } catch (e) {
          // Large payloads live in Supabase Cloud
        }
        window.dispatchEvent(new CustomEvent('webtrex_storage_sync', { detail: { key } }));
      },
    };

    // ========================================================================

    // ========================================================================
    function RevealBlock({ children, className = '', delay = 0 }) {
      const [shown, setShown] = useState(false);
      const ref = useRef(null);

      useEffect(() => {
        const obs = new IntersectionObserver(
          ([entry]) => {
            if (entry.isIntersecting) {
              setShown(true);
              obs.disconnect();
            }
          },
          { threshold: 0.08 }
        );
        if (ref.current) obs.observe(ref.current);
        return () => obs.disconnect();
      }, []);

      return (
        <div
          ref={ref}
          style={{ transitionDelay: `${delay}ms` }}
          className={`transition-all duration-700 ease-out ${
            shown ? 'opacity-100 translate-y-0' : 'opacity-0 translate-y-5'
          } ${className}`}
        >
          {children}
        </div>
      );
    }

    // ========================================================================
    // SIGN IN POPUP MODAL COMPONENT
    // ========================================================================
    function SignInModal({ onClose, onAuthenticated }) {
      const [email, setEmail] = useState('');
      const [password, setPassword] = useState('');
      const [showPassword, setShowPassword] = useState(false);
      const [errorMsg, setErrorMsg] = useState('');
      const [loading, setLoading] = useState(false);

      const handleSubmit = async (e) => {
        e.preventDefault();
        setErrorMsg('');
        setLoading(true);

        try {
          const cleanEmail = email.trim().toLowerCase();
          const cleanPassword = password.trim();
          const computedHash = await computeSaltedHash(cleanPassword);
          const expectedDefaultHash = await getExpectedDefaultHash();

          const storedAdmin = Store.read(STORAGE_KEYS.ADMIN, null);
          let valid = false;
          let adminProfile = {
            email: cleanEmail || INITIAL_ADMIN_EMAIL,
            name: storedAdmin?.name || 'WebTrex Lead Administrator',
            role: storedAdmin?.role || 'Super Administrator',
          };

          if (storedAdmin && storedAdmin.passwordUpdatedAt) {
            const storedEmail = String(storedAdmin.email || INITIAL_ADMIN_EMAIL).trim().toLowerCase();
            const rotatedHash = storedAdmin.salt
              ? await computeSaltedHash(cleanPassword, storedAdmin.salt)
              : computedHash;
            valid = cleanEmail === storedEmail && rotatedHash === storedAdmin.passwordHash;
            adminProfile.email = storedEmail;
          } else {
            valid = cleanEmail === INITIAL_ADMIN_EMAIL && computedHash === expectedDefaultHash;
          }

          if (valid) {
            setEmail('');
            setPassword('');
            onAuthenticated(adminProfile);
          } else {
            setErrorMsg('Invalid administrator email or password. Access denied.');
          }
        } catch (err) {
          setErrorMsg('Authentication error occurred. Please try again.');
        } finally {
          setLoading(false);
        }
      };

      return (
        <div
          className="fixed inset-0 z-50 bg-stone-950/70 backdrop-blur-sm flex items-center justify-center p-4"
          onClick={onClose}
        >
          <div
            className="bg-white rounded-3xl border border-stone-200 max-w-md w-full p-7 sm:p-9 shadow-2xl relative animate-fade-in"
            onClick={(e) => e.stopPropagation()}
          >
            <button
              onClick={onClose}
              className="absolute top-6 right-6 p-2 rounded-full text-stone-400 hover:text-stone-900 hover:bg-stone-100 transition-colors"
              aria-label="Close Sign In Modal"
            >
              <X className="w-5 h-5" />
            </button>

            <div className="mb-8">
              <WebTrexLogo />
              <h2 className="text-3xl font-serif text-[#141716] mt-6">
                Studio Access
              </h2>
              <p className="text-sm text-stone-500 mt-1">
                Sign in with administrator credentials to manage portfolio releases & files.
              </p>
            </div>

            {errorMsg && (
              <div className="mb-5 p-3.5 rounded-2xl bg-rose-50 border border-rose-200 flex items-center gap-2.5 text-rose-700 text-xs font-medium">
                <AlertCircle className="w-4 h-4 shrink-0" />
                <span>{errorMsg}</span>
              </div>
            )}

            <form onSubmit={handleSubmit} className="space-y-4">
              <div>
                <label className="block text-xs font-mono font-bold uppercase tracking-wider text-stone-500 mb-2">
                  Admin Email
                </label>
                <input
                  type="email"
                  required
                  value={email}
                  onChange={(e) => setEmail(e.target.value)}
                  placeholder="name@company.com"
                  className="w-full px-4 py-3.5 rounded-xl bg-[#FAF8F5] border border-stone-200 text-sm text-[#141716] focus:outline-none focus:border-[#0F5132] transition-colors"
                />
              </div>

              <div>
                <label className="block text-xs font-mono font-bold uppercase tracking-wider text-stone-500 mb-2">
                  Password
                </label>
                <div className="relative">
                  <input
                    type={showPassword ? 'text' : 'password'}
                    required
                    value={password}
                    onChange={(e) => setPassword(e.target.value)}
                    placeholder="••••••••••••"
                    className="w-full pl-4 pr-11 py-3.5 rounded-xl bg-[#FAF8F5] border border-stone-200 text-sm text-[#141716] focus:outline-none focus:border-[#0F5132] transition-colors"
                  />
                  <button
                    type="button"
                    onClick={() => setShowPassword(!showPassword)}
                    className="absolute right-3.5 top-1/2 -translate-y-1/2 text-stone-400 hover:text-stone-900"
                    aria-label="Toggle Password Visibility"
                  >
                    {showPassword ? <EyeOff className="w-4 h-4" /> : <Eye className="w-4 h-4" />}
                  </button>
                </div>
              </div>

              <button
                type="submit"
                disabled={loading}
                className="w-full mt-2 py-3.5 rounded-full bg-[#0F1715] text-white text-sm font-bold hover:bg-[#0F5132] transition-colors duration-300 flex items-center justify-center gap-2 disabled:opacity-60"
              >
                {loading ? (
                  <>
                    <RefreshCw className="w-4 h-4 animate-spin" />
                    Verifying Session...
                  </>
                ) : (
                  <>
                    <Lock className="w-4 h-4" />
                    Sign In to Dashboard
                  </>
                )}
              </button>
            </form>
          </div>
        </div>
      );

          const current = Store.read(STORAGE_KEYS.MESSAGES, []);
          const newMsg = {
            id: `msg-${Date.now()}-${Math.random().toString(36).slice(2, 6)}`,
            name: name.trim(),
            email: email.trim(),
            projectType,
            message: message.trim(),
            read: false,
            createdAt: new Date().toISOString(),
          };
          Store.write(STORAGE_KEYS.MESSAGES, [newMsg, ...current]);
          recordActivity('New Inquiry Received', `${name.trim()} submitted a ${projectType} request.`);
          addToast('Message Sent', 'Thank you! Our team will review your project inquiry shortly.');
          setName('');
          setEmail('');
          setMessage('');
        } catch (err) {
          addToast('Submission Failed', 'Could not send your message. Please try again.', 'error');
        } finally {
          setSubmitting(false);
        }
      };

      return (
        <form
          onSubmit={handleSubmit}
          className="bg-white rounded-3xl border border-stone-200 p-6 sm:p-10 space-y-5 shadow-xl shadow-stone-900/5"
        >
          <div className="grid sm:grid-cols-2 gap-5">
            <div>
              <label className="block text-xs font-mono font-bold uppercase tracking-wider text-stone-500 mb-2">
                Your Name
              </label>
              <input
                type="text"
                required
                value={name}
                onChange={(e) => setName(e.target.value)}
                placeholder="Alex Mercer"
                className="w-full px-4 py-3.5 rounded-xl bg-[#FAF8F5] border border-stone-200 text-sm text-[#141716] focus:outline-none focus:border-[#0F5132] transition-colors"
              />
            </div>
            <div>
              <label className="block text-xs font-mono font-bold uppercase tracking-wider text-stone-500 mb-2">
                Email Address
              </label>
              <input
                type="email"
                required
                value={email}
                onChange={(e) => setEmail(e.target.value)}
                placeholder="alex@company.com"
                className="w-full px-4 py-3.5 rounded-xl bg-[#FAF8F5] border border-stone-200 text-sm text-[#141716] focus:outline-none focus:border-[#0F5132] transition-colors"
              />
            </div>
          </div>

          <div>
            <label className="block text-xs font-mono font-bold uppercase tracking-wider text-stone-500 mb-2">
              Project Discipline
            </label>
            <select
              value={projectType}
              onChange={(e) => setProjectType(e.target.value)}
              className="w-full px-4 py-3.5 rounded-xl bg-[#FAF8F5] border border-stone-200 text-sm text-[#141716] focus:outline-none focus:border-[#0F5132] transition-colors"
            >
              <option>Website Development</option>
              <option>Mobile App Development</option>
              <option>UI/UX Design</option>
              <option>Software Development</option>
              <option>E-commerce Solutions</option>
              <option>Custom Digital Solutions</option>
              <option>Web Applications</option>
              <option>Branding & Digital Design</option>
            </select>
          </div>

          <div>
            <label className="block text-xs font-mono font-bold uppercase tracking-wider text-stone-500 mb-2">
              Project Brief & Timeline
            </label>
            <textarea
              rows={4}
              required
              value={message}
              onChange={(e) => setMessage(e.target.value)}
              placeholder="Outline your product goals, key features, and target launch window..."
              className="w-full px-4 py-3.5 rounded-xl bg-[#FAF8F5] border border-stone-200 text-sm text-[#141716] focus:outline-none focus:border-[#0F5132] transition-colors resize-none"
            />
          </div>

          <button
            type="submit"
            disabled={submitting}
            className="inline-flex items-center justify-center gap-2.5 px-8 py-4 rounded-full bg-[#0F1715] text-white text-sm font-bold hover:bg-[#0F5132] transition-colors duration-300 disabled:opacity-60"
          >
            <Send className="w-4 h-4" />
            {submitting ? 'Sending Inquiry...' : 'Submit Project Inquiry'}
          </button>
        </form>
      );
    }

    // ========================================================================
    // ADMIN TAB 1: DASHBOARD OVERVIEW & ANALYTICS
    // ========================================================================
    function AdminOverviewTab({
      projects,
      uploadedFiles,
      messages,
      activityLogs,
      categories,
      onNavigateTab,
    }) {
      const publishedCount = projects.filter((p) => p.status === 'published').length;
      const draftCount = projects.filter((p) => p.status !== 'published').length;
      const unreadMessages = messages.filter((m) => !m.read).length;

      const categoryDistribution = useMemo(() => {
        return categories.map((cat) => {
          const count = projects.filter(
            (p) => p.category?.toLowerCase() === cat.name.toLowerCase()
          ).length;
          return { name: cat.name, count };
        });
      }, [categories, projects]);

      const maxCatCount = Math.max(1, ...categoryDistribution.map((c) => c.count));

      return (
        <div className="space-y-8">
          <div className="grid grid-cols-2 lg:grid-cols-5 gap-4">
            {[
              { label: 'Total Projects', value: projects.length, accent: 'text-stone-900', action: 'manage-projects' },
              { label: 'Published Projects', value: publishedCount, accent: 'text-emerald-700', action: 'manage-projects' },
              { label: 'Draft Projects', value: draftCount, accent: 'text-amber-700', action: 'manage-projects' },
              { label: 'Total Uploaded Files', value: uploadedFiles.length, accent: 'text-stone-900', action: 'files' },
              {
                label: 'Total Messages',
                value: messages.length,
                sub: unreadMessages > 0 ? `${unreadMessages} unread` : 'All read',
                accent: 'text-emerald-700',
                action: 'messages',
              },
            ].map((stat) => (
              <div
                key={stat.label}
                onClick={() => onNavigateTab(stat.action)}
                className="cursor-pointer editorial-card rounded-2xl p-5"
              >
                <p className="text-xs font-semibold text-stone-500">{stat.label}</p>
                <p className={`text-3xl font-bold mt-2 ${stat.accent}`}>
                  {stat.value}
                </p>
                {stat.sub && <p className="text-[11px] font-semibold text-emerald-700 mt-1">{stat.sub}</p>}
              </div>
            ))}
          </div>

          <div className="grid lg:grid-cols-12 gap-6">
            <div className="lg:col-span-7 bg-white rounded-3xl border border-stone-200 p-6 sm:p-7">
              <div className="flex items-center justify-between mb-6">
                <div>
                  <h3 className="text-lg font-bold text-stone-900">Portfolio Distribution by Category</h3>
                  <p className="text-xs text-stone-500">Live count of projects across engineering tracks</p>
                </div>
                <button
                  onClick={() => onNavigateTab('add-project')}
                  className="inline-flex items-center gap-1.5 px-4 py-2 rounded-full bg-[#0F1715] text-white text-xs font-bold hover:bg-[#0F5132] transition-colors"
                >
                  <PlusCircle className="w-3.5 h-3.5" />
                  New Project
                </button>
              </div>

              <div className="space-y-4">
                {categoryDistribution.map((item) => {
                  const pct = Math.round((item.count / maxCatCount) * 100);
                  return (
                    <div key={item.name} className="space-y-1.5">
                      <div className="flex items-center justify-between text-xs font-semibold">
                        <span className="text-stone-700">{item.name}</span>
                        <span className="text-stone-900 font-mono">{item.count}</span>
                      </div>
                      <div className="h-2.5 w-full rounded-full bg-stone-100 overflow-hidden">
                        <div
                          className="h-full rounded-full bg-[#0F5132] transition-all duration-700"
                          style={{ width: `${Math.max(pct, item.count > 0 ? 8 : 0)}%` }}
                        />
                      </div>
                    </div>
                  );
                })}
              </div>
            </div>

            <div className="lg:col-span-5 bg-white rounded-3xl border border-stone-200 p-6 sm:p-7 flex flex-col justify-between">
              <div>
                <div className="flex items-center gap-2 mb-6">
                  <Activity className="w-4 h-4 text-[#0F5132]" />
                  <h3 className="text-lg font-bold text-stone-900">Recent Activities</h3>
                </div>

                {activityLogs.length === 0 ? (
                  <p className="text-xs text-stone-400 py-8 text-center">No activity logs yet.</p>
                ) : (
                  <div className="space-y-4 max-h-80 overflow-y-auto pr-1">
                    {activityLogs.slice(0, 8).map((log) => (
                      <div key={log.id} className="flex items-start gap-3 pb-3 border-b border-stone-100 last:border-0">
                        <span className="w-2 h-2 rounded-full bg-emerald-600 mt-1.5 shrink-0" />
                        <div className="min-w-0 flex-1">
                          <p className="text-xs font-bold text-stone-900">{log.action}</p>
                          <p className="text-xs text-stone-500 mt-0.5 break-words">{log.detail}</p>
                          <p className="text-[10px] font-mono text-stone-400 mt-1">
                            {new Date(log.timestamp).toLocaleString()}
                          </p>
                        </div>
                      </div>
                    ))}
                  </div>
                )}
              </div>
            </div>
          </div>
        </div>
      );
    }
    // ========================================================================
    // ADMIN TAB 2: ADD NEW PROJECT & MULTI-FILE UPLOADER
    // ========================================================================
    function AdminProjectFormTab({
      categories,
      addToast,
      recordActivity,
      onSuccess,
      existingProject = null,
    }) {
      const [title, setTitle] = useState(existingProject?.title || '');
      const [description, setDescription] = useState(existingProject?.description || '');
      const [category, setCategory] = useState(
        existingProject?.category || (categories[0]?.name || 'Website')
      );
      const [thumbnail, setThumbnail] = useState(existingProject?.thumbnail || '');
      const [images, setImages] = useState(existingProject?.images || []);
      const [files, setFiles] = useState(existingProject?.files || []);
      const [websiteUrl, setWebsiteUrl] = useState(existingProject?.websiteUrl || '');
      const [downloadUrl, setDownloadUrl] = useState(existingProject?.downloadUrl || '');
      const [techInput, setTechInput] = useState('');
      const [technologies, setTechnologies] = useState(existingProject?.technologies || []);
      const [date, setDate] = useState(
        existingProject?.date || new Date().toISOString().split('T')[0]
      );
      const [saving, setSaving] = useState(false);

      const handleThumbnailUpload = async (e) => {
        const file = e.target.files?.[0];
        if (!file) return;
        const ext = getFileExt(file.name);
        if (!ALLOWED_IMAGE_EXTS.includes(ext)) {
          addToast('Invalid Thumbnail Format', 'Allowed: JPG, JPEG, PNG, WEBP, SVG', 'error');
          return;
        }
        const dataUrl = await readFileAsDataUrl(file);
        setThumbnail(dataUrl);
        addToast('Thumbnail Loaded', file.name);
      };

      const handleGalleryUpload = async (e) => {
        const selected = Array.from(e.target.files || []);
        if (selected.length === 0) return;

        const loaded = [];
        for (const file of selected) {
          const ext = getFileExt(file.name);
          if (!ALLOWED_IMAGE_EXTS.includes(ext)) {
            addToast('Skipped File', `${file.name} is not a supported image format.`, 'error');
            continue;
          }
          const dataUrl = await readFileAsDataUrl(file);
          loaded.push(dataUrl);
        }
        setImages((prev) => [...prev, ...loaded]);
        if (loaded.length > 0) {
          addToast('Gallery Images Added', `${loaded.length} image(s) attached.`);
        }
      };

      const handleProjectFilesUpload = async (e) => {
        const selected = Array.from(e.target.files || []);
        if (selected.length === 0) return;

        const processed = [];
        for (const file of selected) {
          const ext = getFileExt(file.name);
          if (!ALLOWED_FILE_EXTS.includes(ext)) {
            addToast(
              'Unsupported File Format',
              `${file.name}: Allowed formats are JPG, JPEG, PNG, WEBP, SVG, APK, ISO, PDF, DOCX, TXT, ZIP.`,
              'error'
            );
            continue;
          }
          const dataUrl = await readFileAsDataUrl(file);
          processed.push({
            id: `file-${Date.now()}-${Math.random().toString(36).slice(2, 7)}`,
            name: file.name,
            type: ext.toUpperCase(),
            size: file.size,
            uploadDate: new Date().toISOString().split('T')[0],
            dataUrl,
          });
        }

        setFiles((prev) => [...prev, ...processed]);
        if (processed.length > 0) {
          addToast('Files Attached', `${processed.length} release file(s) ready for storage.`);
        }
      };

      const handleAddTech = (e) => {
        if (e.key === 'Enter' || e.type === 'click') {
          e.preventDefault();
          const val = techInput.trim();
          if (val && !technologies.includes(val)) {
            setTechnologies([...technologies, val]);
            setTechInput('');
          }
        }
      };

      const handleSaveProject = async (targetStatus) => {
        if (!title.trim() || !description.trim()) {
          addToast('Missing Required Fields', 'Please enter a project title and description.', 'error');
          return;
        }

        setSaving(true);
        try {
          const rawThumbnail =
            thumbnail ||
            createArchitecturalArt(
              ['#14211D', '#FAF8F5', '#10B981'],
              title.trim(),
              `WTX // ${category.toUpperCase()}`
            );

          const finalThumbnail = await WebTrexDB.uploadDataUrlImageToCloud(rawThumbnail, 'thumb');

          const rawImages = images.length > 0 ? images : [finalThumbnail];
          const finalImages = await Promise.all(
            rawImages.map((img, idx) => WebTrexDB.uploadDataUrlImageToCloud(img, `gallery-${idx}`))
          );

          const uploadedReleaseFiles = await Promise.all(
            files.map((f) => WebTrexDB.uploadBinaryToCloud(f))
          );

          const projectId = existingProject?.id || `proj-${Date.now()}-${Math.random().toString(36).slice(2, 6)}`;

          const payload = {
            id: projectId,
            title: title.trim(),
            description: description.trim(),
            category,
            thumbnail: finalThumbnail,
            images: finalImages,
            files: uploadedReleaseFiles.map((f) => ({ ...f, registeredInDb: true })),
            websiteUrl: websiteUrl.trim(),
            downloadUrl: downloadUrl.trim(),
            technologies,
            date,
            status: targetStatus,
            createdAt: existingProject?.createdAt || new Date().toISOString(),
            updatedAt: new Date().toISOString(),
          };

          const allProjects = Store.read(STORAGE_KEYS.PROJECTS, []);
          const updatedProjects = existingProject
            ? allProjects.map((p) => (p.id === existingProject.id ? payload : p))
            : [payload, ...allProjects];
          Store.write(STORAGE_KEYS.PROJECTS, updatedProjects);

          const allFiles = Store.read(STORAGE_KEYS.FILES, []);
          const newFilesToRegister = uploadedReleaseFiles
            .filter((f) => !f.registeredInDb)
            .map((f) => ({
              ...f,
              registeredInDb: true,
              projectId,
              projectTitle: title.trim(),
            }));
          if (newFilesToRegister.length > 0) {
            Store.write(STORAGE_KEYS.FILES, [...newFilesToRegister, ...allFiles]);
          }

          recordActivity(
            existingProject
              ? 'Project Updated'
              : targetStatus === 'published'
              ? 'Project Published'
              : 'Draft Saved',
            `${title.trim()} (${category}) — Status: ${targetStatus.toUpperCase()}`
          );

          addToast(
            targetStatus === 'published' ? 'Project Published Live!' : 'Draft Saved',
            targetStatus === 'published'
              ? 'Your project is now live on the public WebTrex portfolio.'
              : 'Saved as draft in your project manager.'
          );
          onSuccess();
        } catch (err) {
          addToast('Save Error', 'Failed to save project.', 'error');
        } finally {
          setSaving(false);
        }
      };

      return (
        <div className="bg-white rounded-3xl border border-stone-200/90 shadow-sm p-6 sm:p-9 space-y-8">
          <div className="grid md:grid-cols-2 gap-6">
            <div>
              <label className="block text-xs font-bold uppercase tracking-wider text-stone-500 mb-2">
                Project Title *
              </label>
              <input
                type="text"
                value={title}
                onChange={(e) => setTitle(e.target.value)}
                placeholder="e.g., NovaPay Mobile Banking App"
                className="w-full px-4 py-3 rounded-xl bg-[#FBF9F5] border border-stone-200 text-stone-900 placeholder-stone-400 text-sm focus:outline-none focus:border-emerald-700"
              />
            </div>

            <div className="grid grid-cols-2 gap-4">
              <div>
                <label className="block text-xs font-bold uppercase tracking-wider text-stone-500 mb-2">
                  Project Category *
                </label>
                <select
                  value={category}
                  onChange={(e) => setCategory(e.target.value)}
                  className="w-full px-4 py-3 rounded-xl bg-[#FBF9F5] border border-stone-200 text-stone-900 placeholder-stone-400 text-sm focus:outline-none focus:border-emerald-700"
                >
                  {categories.map((cat) => (
                    <option key={cat.name} value={cat.name}>
                      {cat.name}
                    </option>
                  ))}
                </select>
              </div>

              <div>
                <label className="block text-xs font-bold uppercase tracking-wider text-stone-500 mb-2">
                  Project Date
                </label>
                <input
                  type="date"
                  value={date}
                  onChange={(e) => setDate(e.target.value)}
                  className="w-full px-4 py-3 rounded-xl bg-[#FBF9F5] border border-stone-200 text-stone-900 placeholder-stone-400 text-sm focus:outline-none focus:border-emerald-700"
                />
              </div>
            </div>
          </div>

          <div>
            <label className="block text-xs font-bold uppercase tracking-wider text-stone-500 mb-2">
              Project Description *
            </label>
            <textarea
              rows={4}
              value={description}
              onChange={(e) => setDescription(e.target.value)}
              placeholder="Comprehensive overview of architecture, user experience, and business impact..."
              className="w-full px-4 py-3 rounded-xl bg-[#FBF9F5] border border-stone-200 text-stone-900 placeholder-stone-400 text-sm focus:outline-none focus:border-emerald-700 resize-none"
            />
          </div>

          <div className="grid md:grid-cols-3 gap-6">
            <div className="p-5 rounded-2xl bg-[#FBF9F5] border border-stone-200 text-stone-900 placeholder-stone-400 space-y-3">
              <p className="text-xs font-bold uppercase tracking-wider text-stone-700">
                1. Project Thumbnail
              </p>
              <p className="text-[11px] text-stone-500">JPG, JPEG, PNG, WEBP, SVG</p>
              {thumbnail && (
                <img
                  src={thumbnail}
                  alt="Thumbnail preview"
                  className="w-full h-28 object-cover rounded-xl border border-stone-200"
                />
              )}
              <label className="cursor-pointer inline-flex items-center justify-center gap-2 w-full py-2.5 px-4 rounded-xl bg-white border border-stone-300 text-stone-900 text-xs font-semibold hover:border-emerald-700 transition-colors">
                <ImageIcon className="w-4 h-4" />
                {thumbnail ? 'Replace Thumbnail' : 'Upload Thumbnail'}
                <input
                  type="file"
                  accept=".jpg,.jpeg,.png,.webp,.svg"
                  onChange={handleThumbnailUpload}
                  className="hidden"
                />
              </label>
            </div>

            <div className="p-5 rounded-2xl bg-[#FBF9F5] border border-stone-200 text-stone-900 placeholder-stone-400 space-y-3">
              <p className="text-xs font-bold uppercase tracking-wider text-stone-700">
                2. Gallery Images ({images.length})
              </p>
              <p className="text-[11px] text-stone-500">Upload multiple showcase screenshots</p>
              {images.length > 0 && (
                <div className="flex gap-2 overflow-x-auto py-1">
                  {images.map((img, i) => (
                    <div key={i} className="relative w-14 h-14 shrink-0">
                      <img src={img} alt="" className="w-full h-full object-cover rounded-lg border" />
                      <button
                        type="button"
                        onClick={() => setImages(images.filter((_, idx) => idx !== i))}
                        className="absolute -top-1.5 -right-1.5 w-5 h-5 rounded-full bg-red-600 text-stone-900 text-[10px] flex items-center justify-center"
                      >
                        ×
                      </button>
                    </div>
                  ))}
                </div>
              )}
              <label className="cursor-pointer inline-flex items-center justify-center gap-2 w-full py-2.5 px-4 rounded-xl bg-white border border-stone-300 text-stone-900 text-xs font-semibold hover:border-emerald-700 transition-colors">
                <Upload className="w-4 h-4" />
                Add Gallery Images
                <input
                  type="file"
                  multiple
                  accept=".jpg,.jpeg,.png,.webp,.svg"
                  onChange={handleGalleryUpload}
                  className="hidden"
                />
              </label>
            </div>

            <div className="p-5 rounded-2xl bg-[#FBF9F5] border border-stone-200 text-stone-900 placeholder-stone-400 space-y-3">
              <p className="text-xs font-bold uppercase tracking-wider text-stone-700">
                3. Downloadable Files ({files.length})
              </p>
              <p className="text-[11px] text-stone-500">
                APK, ISO, ZIP, PDF, DOCX, TXT, Images
              </p>
              {files.length > 0 && (
                <div className="space-y-1.5 max-h-24 overflow-y-auto">
                  {files.map((f, idx) => (
                    <div
                      key={f.id || idx}
                      className="flex items-center justify-between text-[11px] bg-white px-2.5 py-1.5 rounded-lg border border-stone-200"
                    >
                      <span className="truncate font-medium max-w-[140px]">{f.name}</span>
                      <button
                        type="button"
                        onClick={() => setFiles(files.filter((_, i) => i !== idx))}
                        className="text-red-600 font-bold ml-2"
                      >
                        Remove
                      </button>
                    </div>
                  ))}
                </div>
              )}
              <label className="cursor-pointer inline-flex items-center justify-center gap-2 w-full py-2.5 px-4 rounded-xl bg-[#0F1715] text-white shadow-sm text-xs font-semibold hover:bg-emerald-800 transition-colors">
                <Package className="w-4 h-4" />
                Upload Release Files
                <input
                  type="file"
                  multiple
                  accept=".jpg,.jpeg,.png,.webp,.svg,.apk,.iso,.pdf,.docx,.txt,.zip"
                  onChange={handleProjectFilesUpload}
                  className="hidden"
                />
              </label>
            </div>
          </div>

          <div className="grid md:grid-cols-2 gap-6">
            <div>
              <label className="block text-xs font-bold uppercase tracking-wider text-stone-500 mb-2">
                Project Website URL
              </label>
              <input
                type="url"
                value={websiteUrl}
                onChange={(e) => setWebsiteUrl(e.target.value)}
                placeholder="https://client-project.com"
                className="w-full px-4 py-3 rounded-xl bg-[#FBF9F5] border border-stone-200 text-stone-900 placeholder-stone-400 text-sm focus:outline-none focus:border-emerald-700"
              />
            </div>
            <div>
              <label className="block text-xs font-bold uppercase tracking-wider text-stone-500 mb-2">
                External Download URL (Optional)
              </label>
              <input
                type="url"
                value={downloadUrl}
                onChange={(e) => setDownloadUrl(e.target.value)}
                placeholder="https://releases.webtrex.studio/app.apk"
                className="w-full px-4 py-3 rounded-xl bg-[#FBF9F5] border border-stone-200 text-stone-900 placeholder-stone-400 text-sm focus:outline-none focus:border-emerald-700"
              />
            </div>
          </div>

          <div>
            <label className="block text-xs font-bold uppercase tracking-wider text-stone-500 mb-2">
              Project Technologies
            </label>
            <div className="flex gap-2">
              <input
                type="text"
                value={techInput}
                onChange={(e) => setTechInput(e.target.value)}
                onKeyDown={handleAddTech}
                placeholder="Type a technology (e.g., Next.js, Kotlin, Docker) and press Enter"
                className="flex-1 px-4 py-3 rounded-xl bg-[#FBF9F5] border border-stone-200 text-stone-900 placeholder-stone-400 text-sm focus:outline-none focus:border-emerald-700"
              />
              <button
                type="button"
                onClick={handleAddTech}
                className="px-5 py-3 rounded-xl bg-stone-200 text-stone-900 hover:bg-stone-300 text-xs font-bold hover:bg-neutral-300"
              >
                Add Tag
              </button>
            </div>
            {technologies.length > 0 && (
              <div className="flex flex-wrap gap-2 mt-3">
                {technologies.map((t) => (
                  <span
                    key={t}
                    className="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-emerald-50 text-emerald-800 border border-emerald-200 text-xs font-semibold"
                  >
                    {t}
                    <button
                      type="button"
                      onClick={() => setTechnologies(technologies.filter((item) => item !== t))}
                      className="hover:text-red-600"
                    >
                      ×
                    </button>
                  </span>
                ))}
              </div>
            )}
          </div>

          <div className="pt-6 border-t border-stone-200 flex flex-wrap items-center justify-end gap-3">
            <button
              type="button"
              disabled={saving}
              onClick={() => handleSaveProject('draft')}
              className="px-6 py-3.5 rounded-full border border-stone-300 text-stone-900 text-sm font-semibold hover:border-emerald-700 transition-colors disabled:opacity-50"
            >
              Save as Draft
            </button>
            <button
              type="button"
              disabled={saving}
              onClick={() => handleSaveProject('published')}
              className="inline-flex items-center gap-2 px-8 py-3.5 rounded-full bg-[#0F1715] text-white shadow-sm text-sm font-semibold hover:bg-emerald-800 transition-colors disabled:opacity-50"
            >
              <CheckCircle2 className="w-4 h-4" />
              {saving ? 'Publishing...' : existingProject ? 'Update & Publish Project' : 'Publish Project'}
            </button>
          </div>
        </div>
      );
    }

    // ========================================================================
    // ADMIN TAB 3: MANAGE PROJECTS
    // ========================================================================
    function AdminManageProjectsTab({
      projects,
      categories,
      addToast,
      recordActivity,
      onAddNew,
    }) {
      const [search, setSearch] = useState('');
      const [catFilter, setCatFilter] = useState('All');
      const [sortBy, setSortBy] = useState('newest');
      const [editingProject, setEditingProject] = useState(null);

      const filtered = useMemo(() => {
        return projects
          .filter((p) => {
            const matchCat = catFilter === 'All' || p.category === catFilter;
            const q = search.toLowerCase();
            const matchSearch =
              !q ||
              p.title?.toLowerCase().includes(q) ||
              p.description?.toLowerCase().includes(q);
            return matchCat && matchSearch;
          })
          .sort((a, b) => {
            if (sortBy === 'title') return (a.title || '').localeCompare(b.title || '');
            if (sortBy === 'oldest') return (a.date || '').localeCompare(b.date || '');
            return (b.date || '').localeCompare(a.date || '');
          });
      }, [projects, search, catFilter, sortBy]);

      const toggleStatus = (project) => {
        const nextStatus = project.status === 'published' ? 'draft' : 'published';
        const next = projects.map((p) =>
          p.id === project.id ? { ...p, status: nextStatus } : p
        );
        Store.write(STORAGE_KEYS.PROJECTS, next);
        recordActivity(
          nextStatus === 'published' ? 'Project Published' : 'Project Unpublished',
          `${project.title} moved to ${nextStatus.toUpperCase()}`
        );
        addToast(
          nextStatus === 'published' ? 'Project Published' : 'Moved to Drafts',
          `${project.title} is now ${nextStatus}.`
        );
      };

      const handleDelete = (project) => {
        const next = projects.filter((p) => p.id !== project.id);
        Store.write(STORAGE_KEYS.PROJECTS, next);
        recordActivity('Project Deleted', `Removed project: ${project.title}`);
        addToast('Project Deleted', `${project.title} has been permanently removed.`);
      };

      const handleDeleteAllProjects = () => {
        if (projects.length === 0) return;
        Store.write(STORAGE_KEYS.PROJECTS, []);
        recordActivity('All Projects Cleared', `Removed ${projects.length} project(s).`);
        addToast('All Projects Removed', 'The portfolio is now empty.');
      };

      if (editingProject) {
        return (
          <div className="space-y-4">
            <button
              onClick={() => setEditingProject(null)}
              className="inline-flex items-center gap-2 text-xs font-bold text-stone-500 hover:text-stone-900"
            >
              ← Back to All Projects
            </button>
            <AdminProjectFormTab
              categories={categories}
              addToast={addToast}
              recordActivity={recordActivity}
              existingProject={editingProject}
              onSuccess={() => setEditingProject(null)}
            />
          </div>
        );
      }

      return (
        <div className="space-y-6">
          <div className="bg-white rounded-2xl border border-stone-200 p-4 flex flex-col md:flex-row items-stretch md:items-center justify-between gap-4">
            <div className="flex flex-wrap items-center gap-3 flex-1">
              <div className="relative flex-1 min-w-[200px]">
                <Search className="w-4 h-4 text-stone-400 absolute left-3.5 top-1/2 -translate-y-1/2" />
                <input
                  type="text"
                  value={search}
                  onChange={(e) => setSearch(e.target.value)}
                  placeholder="Search projects..."
                  className="w-full pl-10 pr-4 py-2.5 rounded-xl bg-[#FBF9F5] border border-stone-200 text-stone-900 placeholder-stone-400 text-sm focus:outline-none focus:border-emerald-700"
                />
              </div>
              <select
                value={catFilter}
                onChange={(e) => setCatFilter(e.target.value)}
                className="px-3.5 py-2.5 rounded-xl bg-[#FBF9F5] border border-stone-200 text-stone-900 placeholder-stone-400 text-sm"
              >
                <option value="All">All Categories</option>
                {categories.map((c) => (
                  <option key={c.name} value={c.name}>
                    {c.name}
                  </option>
                ))}
              </select>
              <select
                value={sortBy}
                onChange={(e) => setSortBy(e.target.value)}
                className="px-3.5 py-2.5 rounded-xl bg-[#FBF9F5] border border-stone-200 text-stone-900 placeholder-stone-400 text-sm"
              >
                <option value="newest">Newest First</option>
                <option value="oldest">Oldest First</option>
                <option value="title">Title (A–Z)</option>
              </select>
            </div>

            <div className="flex items-center gap-2">
              {projects.length > 0 && (
                <button
                  onClick={handleDeleteAllProjects}
                  className="inline-flex items-center justify-center gap-2 px-4 py-2.5 rounded-xl border border-red-200 bg-rose-50 text-rose-700 text-sm font-semibold hover:bg-red-100 transition-colors"
                >
                  <Trash2 className="w-4 h-4" />
                  Delete All ({projects.length})
                </button>
              )}
              <button
                onClick={onAddNew}
                className="inline-flex items-center justify-center gap-2 px-5 py-2.5 rounded-xl bg-[#0F1715] text-white shadow-sm text-sm font-semibold hover:bg-emerald-800 transition-colors"
              >
                <PlusCircle className="w-4 h-4" />
                Add New Project
              </button>
            </div>
          </div>

          <div className="bg-white rounded-3xl border border-stone-200/90 shadow-sm overflow-hidden">
            {filtered.length === 0 ? (
              <div className="p-12 text-center text-sm text-stone-500">
                No projects found. Click "Add New Project" to publish your first release.
              </div>
            ) : (
              <div className="overflow-x-auto">
                <table className="w-full text-left border-collapse">
                  <thead>
                    <tr className="border-b border-stone-200 bg-[#F7F4EE] text-[11px] font-bold uppercase tracking-wider text-stone-500">
                      <th className="py-4 px-6">Project</th>
                      <th className="py-4 px-4">Category</th>
                      <th className="py-4 px-4">Files</th>
                      <th className="py-4 px-4">Status</th>
                      <th className="py-4 px-6 text-right">Actions</th>
                    </tr>
                  </thead>
                  <tbody className="divide-y divide-stone-200 text-sm">
                    {filtered.map((proj) => (
                      <tr key={proj.id} className="hover:bg-[#FAF7F2] transition-colors">
                        <td className="py-4 px-6">
                          <div className="flex items-center gap-3.5">
                            <img
                              src={proj.thumbnail}
                              alt=""
                              className="w-14 h-10 rounded-lg object-cover border border-stone-200 shrink-0"
                            />
                            <div>
                              <p className="font-bold text-stone-900">{proj.title}</p>
                              <p className="text-xs text-stone-500 font-mono">{proj.date}</p>
                            </div>
                          </div>
                        </td>
                        <td className="py-4 px-4">
                          <span className="px-2.5 py-1 rounded-full bg-stone-100 text-stone-800 text-xs font-semibold">
                            {proj.category}
                          </span>
                        </td>
                        <td className="py-4 px-4 text-xs text-stone-500 font-medium">
                          {(proj.files || []).length} file(s)
                        </td>
                        <td className="py-4 px-4">
                          <span
                            className={`inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-bold ${
                              proj.status === 'published'
                                ? 'bg-emerald-50 text-emerald-800 border border-emerald-200'
                                : 'bg-amber-50 text-amber-800 border border-amber-200'
                            }`}
                          >
                            <span
                              className={`w-1.5 h-1.5 rounded-full ${
                                proj.status === 'published' ? 'bg-emerald-500' : 'bg-amber-500'
                              }`}
                            />
                            {proj.status === 'published' ? 'Published' : 'Draft'}
                          </span>
                        </td>
                        <td className="py-4 px-6 text-right">
                          <div className="inline-flex items-center gap-2">
                            <button
                              onClick={() => toggleStatus(proj)}
                              className="px-3 py-1.5 rounded-lg border border-stone-200 text-xs font-semibold hover:border-emerald-700 transition-colors"
                            >
                              {proj.status === 'published' ? 'Unpublish' : 'Publish'}
                            </button>
                            <button
                              onClick={() => setEditingProject(proj)}
                              className="p-2 rounded-lg border border-stone-200 text-stone-700 hover:bg-stone-100"
                              title="Edit Project"
                            >
                              <Edit3 className="w-4 h-4" />
                            </button>
                            <button
                              onClick={() => handleDelete(proj)}
                              className="p-2 rounded-lg border border-rose-200 text-rose-600 hover:bg-rose-50"
                              title="Delete Project"
                            >
                              <Trash2 className="w-4 h-4" />
                            </button>
                          </div>
                        </td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            )}
          </div>
        </div>
      );
    }

    // ========================================================================
    // ADMIN TAB 4: CATEGORIES MANAGER
    // ========================================================================
    function AdminCategoriesTab({ categories, projects, addToast, recordActivity }) {
      const [name, setName] = useState('');
      const [description, setDescription] = useState('');

      const handleAddCategory = (e) => {
        e.preventDefault();
        if (!name.trim()) return;
        const nextCat = {
          id: `cat-${Date.now()}`,
          name: name.trim(),
          publicLabel: name.trim(),
          slug: name.trim().toLowerCase().replace(/[^a-z0-9]+/g, '-'),
          description: description.trim() || 'Custom project category',
        };
        Store.write(STORAGE_KEYS.CATEGORIES, [...categories, nextCat]);
        recordActivity('Category Added', `Created category: ${name.trim()}`);
        addToast('Category Added', `${name.trim()} is now available.`);
        setName('');
        setDescription('');
      };

      const handleDeleteCategory = (cat) => {
        if (!cat.id) return;
        Store.write(
          STORAGE_KEYS.CATEGORIES,
          categories.filter((c) => c.id !== cat.id)
        );
        recordActivity('Category Deleted', `Removed category: ${cat.name}`);
        addToast('Category Removed', `${cat.name} deleted.`);
      };

      return (
        <div className="grid lg:grid-cols-12 gap-8">
          <form
            onSubmit={handleAddCategory}
            className="lg:col-span-5 bg-white rounded-3xl border border-stone-200/90 shadow-sm p-6 sm:p-7 space-y-4 h-fit"
          >
            <h3 className="text-lg font-bold text-stone-900">Create New Category</h3>
            <div>
              <label className="block text-xs font-bold uppercase tracking-wider text-stone-500 mb-2">
                Category Name
              </label>
              <input
                type="text"
                required
                value={name}
                onChange={(e) => setName(e.target.value)}
                placeholder="e.g., AI & Machine Learning"
                className="w-full px-4 py-3 rounded-xl bg-[#FBF9F5] border border-stone-200 text-stone-900 placeholder-stone-400 text-sm focus:outline-none focus:border-emerald-700"
              />
            </div>
            <div>
              <label className="block text-xs font-bold uppercase tracking-wider text-stone-500 mb-2">
                Description
              </label>
              <input
                type="text"
                value={description}
                onChange={(e) => setDescription(e.target.value)}
                placeholder="Short category summary..."
                className="w-full px-4 py-3 rounded-xl bg-[#FBF9F5] border border-stone-200 text-stone-900 placeholder-stone-400 text-sm focus:outline-none focus:border-emerald-700"
              />
            </div>
            <button
              type="submit"
              className="w-full py-3 rounded-full bg-[#0F1715] text-white shadow-sm text-sm font-semibold hover:bg-emerald-800 transition-colors"
            >
              Add Category
            </button>
          </form>

          <div className="lg:col-span-7 bg-white rounded-3xl border border-stone-200/90 shadow-sm p-6 sm:p-7 space-y-3">
            <h3 className="text-lg font-bold text-stone-900 mb-4">Active Categories</h3>
            {categories.map((cat) => {
              const count = projects.filter(
                (p) => p.category?.toLowerCase() === cat.name.toLowerCase()
              ).length;
              return (
                <div
                  key={cat.id || cat.name}
                  className="flex items-center justify-between p-4 rounded-2xl bg-[#FBF9F5] border border-stone-200 text-stone-900 placeholder-stone-400"
                >
                  <div>
                    <p className="text-sm font-bold text-stone-900">{cat.name}</p>
                    <p className="text-xs text-stone-500">{cat.description}</p>
                  </div>
                  <div className="flex items-center gap-3">
                    <span className="text-xs font-semibold px-2.5 py-1 rounded-full bg-stone-100 border border-stone-200 text-stone-800">
                      {count} projects
                    </span>
                    {cat.id && (
                      <button
                        onClick={() => handleDeleteCategory(cat)}
                        className="p-2 rounded-lg text-red-600 hover:bg-red-50"
                        title="Delete Category"
                      >
                        <Trash2 className="w-4 h-4" />
                      </button>
                    )}
                  </div>
                </div>
              );
            })}
          </div>
        </div>
      );
    }

    // ========================================================================
    // ADMIN TAB 5: UPLOADED FILES MANAGER
    // ========================================================================
    function AdminFilesTab({ uploadedFiles, addToast, recordActivity, onDownload }) {
      const handleDeleteFile = (file) => {
        Store.write(
          STORAGE_KEYS.FILES,
          uploadedFiles.filter((f) => f.id !== file.id)
        );
        recordActivity('File Deleted', `Removed binary asset: ${file.name}`);
        addToast('File Deleted', `${file.name} removed from storage.`);
      };

      return (
        <div className="bg-white rounded-3xl border border-stone-200/90 shadow-sm overflow-hidden">
          <div className="p-6 border-b border-stone-200 flex items-center justify-between">
            <div>
              <h3 className="text-lg font-bold text-stone-900">Central Asset & Binary Repository</h3>
              <p className="text-xs text-stone-500">
                All APK, ISO, ZIP, PDF, DOCX, TXT, and image packages attached across WebTrex projects
              </p>

            <span className="px-3 py-1 rounded-full bg-emerald-50 text-emerald-700 border border-emerald-200 text-xs font-bold">
              {uploadedFiles.length} Total Files
            </span>
          </div>

          {uploadedFiles.length === 0 ? (
            <div className="p-12 text-center text-sm text-stone-500">
              No files uploaded yet. Upload files when creating or editing a project.
            </div>

            <div className="overflow-x-auto">
              <table className="w-full text-left border-collapse">
                <thead>
                  <tr className="border-b border-stone-200 bg-[#F7F4EE] text-[11px] font-bold uppercase tracking-wider text-stone-500">
                    <th className="py-3.5 px-6">File Name</th>
                    <th className="py-3.5 px-4">Type</th>
                    <th className="py-3.5 px-4">Size</th>
                    <th className="py-3.5 px-4">Upload Date</th>
                    <th className="py-3.5 px-4">Associated Project</th>
                    <th className="py-3.5 px-6 text-right">Actions</th>
                  </tr>
                </thead>
                <tbody className="divide-y divide-stone-200 text-sm">
                  {uploadedFiles.map((file) => (
                    <tr key={file.id} className="hover:bg-[#FAF7F2]">
                      <td className="py-4 px-6 font-semibold text-stone-900">{file.name}</td>
                      <td className="py-4 px-4">
                        <span className="px-2.5 py-0.5 rounded-md bg-emerald-50 text-emerald-800 border border-emerald-200 text-xs font-bold">
                          {file.type || getFileExt(file.name).toUpperCase()}
                        </span>
                      </td>
                      <td className="py-4 px-4 text-xs font-mono text-stone-500">
                        {formatBytes(file.size)}

                      <td className="py-4 px-4 text-xs font-mono text-stone-500">
                        {file.uploadDate}
                      </td>
                      <td className="py-4 px-4 text-xs font-medium text-stone-700">
                        {file.projectTitle || 'Unlinked'}
                      </td>
                      <td className="py-4 px-6 text-right">
                        <div className="inline-flex items-center gap-2">
                          <button
                            onClick={() => onDownload(file)}
                            className="p-2 rounded-lg border border-stone-200 text-stone-700 hover:bg-stone-100"
                            title="Download File"
                          >
                            <Download className="w-4 h-4" />
                          </button>
                          <button
                            onClick={() => handleDeleteFile(file)}
                            className="p-2 rounded-lg border border-rose-200 text-rose-600 hover:bg-rose-50"
                            title="Delete File"
                          >
                            <Trash2 className="w-4 h-4" />

                </tbody>
              </table>
            </div>
          )}
        </div>
      );
    }

    // ========================================================================
    // ADMIN TAB 6: CLIENT MESSAGES INBOX
    // ========================================================================
    function AdminMessagesTab({ messages, addToast, recordActivity }) {
      const [selectedMsg, setSelectedMsg] = useState(null);

      const toggleRead = (msg) => {
        const next = messages.map((m) => (m.id === msg.id ? { ...m, read: !m.read } : m));
        Store.write(STORAGE_KEYS.MESSAGES, next);
        setSelectedMsg({ ...msg, read: !msg.read });
      };

      const handleDeleteMsg = (msg) => {
        Store.write(
          STORAGE_KEYS.MESSAGES,
          messages.filter((m) => m.id !== msg.id)
        );
        recordActivity('Message Deleted', `Deleted inquiry from ${msg.name}`);
        if (selectedMsg?.id === msg.id) setSelectedMsg(null);
        addToast('Message Deleted', 'Inquiry removed from inbox.');
      };

      return (
        <div className="grid lg:grid-cols-12 gap-6">
          <div className="lg:col-span-5 bg-white rounded-3xl border border-stone-200/90 shadow-sm overflow-hidden">
            <div className="p-5 border-b border-stone-200 flex items-center justify-between">
              <h3 className="font-bold text-stone-900">Inbox ({messages.length})</h3>
              <span className="text-xs text-emerald-700 font-semibold">
                {messages.filter((m) => !m.read).length} Unread
              </span>
            </div>

            {messages.length === 0 ? (
              <div className="p-10 text-center text-sm text-stone-500">
                No client messages submitted yet.
              </div>
            ) : (
              <div className="divide-y divide-stone-200 max-h-[540px] overflow-y-auto">
                {messages.map((msg) => (
                  <div
                    key={msg.id}
                    onClick={() => {
                      setSelectedMsg({ ...msg, read: true });
                      if (!msg.read) {
                        Store.write(
                          STORAGE_KEYS.MESSAGES,
                          messages.map((m) => (m.id === msg.id ? { ...m, read: true } : m))
                        );
                      }
                    }}
                    className={`p-5 cursor-pointer transition-colors ${
                      selectedMsg?.id === msg.id ? 'bg-emerald-50/70' : 'hover:bg-[#FAF7F2]'
                    }`}
                  >
                    <div className="flex items-center justify-between gap-2">
                      <div className="flex items-center gap-2">
                        {!msg.read && <span className="w-2 h-2 rounded-full bg-blue-600" />}
                        <p className="text-sm font-bold text-stone-900">{msg.name}</p>
                      </div>
                      <span className="text-[11px] font-mono text-stone-400">
                        {new Date(msg.createdAt).toLocaleDateString()}
                      </span>
                    </div>
                    <p className="text-xs font-semibold text-emerald-700 mt-1">{msg.projectType}</p>
                    <p className="text-xs text-stone-500 mt-1.5 line-clamp-2">{msg.message}</p>
                  </div>
                ))}
              </div>
            )}
          </div>

          <div className="lg:col-span-7 bg-white rounded-3xl border border-stone-200/90 shadow-sm p-6 sm:p-8">
            {selectedMsg ? (
              <div className="space-y-6">
                <div className="flex flex-wrap items-start justify-between gap-4 pb-5 border-b border-stone-200">
                  <div>
                    <span className="px-3 py-1 rounded-full bg-emerald-50 text-emerald-800 border border-emerald-200 text-xs font-bold">
                      {selectedMsg.projectType}
                    </span>
                    <h3 className="text-2xl font-bold text-stone-900 mt-3">{selectedMsg.name}</h3>
                    <a
                      href={`mailto:${selectedMsg.email}`}
                      className="text-sm text-emerald-700 hover:underline font-medium"
                    >
                      {selectedMsg.email}
                    </a>
                  </div>
                  <div className="flex items-center gap-2">
                    <button
                      onClick={() => toggleRead(selectedMsg)}
                      className="px-3.5 py-2 rounded-xl border border-stone-200 text-xs font-semibold hover:border-emerald-700"
                    >
                      {selectedMsg.read ? 'Mark Unread' : 'Mark Read'}
                    </button>
                    <button
                      onClick={() => handleDeleteMsg(selectedMsg)}
                      className="p-2 rounded-xl border border-rose-200 text-rose-600 hover:bg-rose-50"
                    >
                      <Trash2 className="w-4 h-4" />
                    </button>
                  </div>
                </div>

                <div className="p-5 rounded-2xl bg-[#FBF9F5] border border-stone-200 text-stone-900 placeholder-stone-400 text-sm text-stone-800 leading-relaxed whitespace-pre-line">
                  {selectedMsg.message}
                </div>

                <a
                  href={`mailto:${selectedMsg.email}?subject=Re: ${encodeURIComponent(
                    selectedMsg.projectType
                  )} — WEBTREX`}
                  className="inline-flex items-center gap-2 px-6 py-3 rounded-full bg-[#0F1715] text-white shadow-sm text-sm font-semibold hover:bg-emerald-800 transition-colors"
                >
                  <Mail className="w-4 h-4" />
                  Reply via Email
                </a>
              </div>
            ) : (
              <div className="h-full min-h-[300px] flex flex-col items-center justify-center text-center text-stone-400">
                <MessageSquare className="w-10 h-10 mb-3 text-neutral-300" />
                <p className="text-sm font-medium">Select a message from the inbox to read details</p>
              </div>
            )}
          </div>
        </div>
      );
    }

    // ========================================================================
    // ADMIN TAB 7: WEBSITE SETTINGS
    // ========================================================================
    function AdminSettingsTab({ settings, addToast, recordActivity }) {
      const [form, setForm] = useState(settings);
      const [saving, setSaving] = useState(false);

      useEffect(() => {
        setForm(settings);
      }, [settings]);

      const handleSave = (e) => {
        e.preventDefault();
        setSaving(true);
        try {
          Store.write(STORAGE_KEYS.SETTINGS, form);
          recordActivity('Website Settings Updated', 'Updated public agency metadata & contact links.');
          addToast('Settings Saved', 'Public website updated immediately.');
        } finally {
          setSaving(false);
        }
      };

      return (
        <form
          onSubmit={handleSave}
          className="bg-white rounded-3xl border border-stone-200/90 shadow-sm p-6 sm:p-9 space-y-6 max-w-4xl"
        >
          <div className="grid sm:grid-cols-2 gap-6">
            <div>
              <label className="block text-xs font-bold uppercase tracking-wider text-stone-500 mb-2">
                Agency Tagline
              </label>
              <input
                type="text"

            </div>
            <div>
              <label className="block text-xs font-bold uppercase tracking-wider text-stone-500 mb-2">
