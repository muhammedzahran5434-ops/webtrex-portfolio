              </label>
              <input
                type="email"
                value={form.email || ''}
                onChange={(e) => setForm({ ...form, email: e.target.value })}
                className="w-full px-4 py-3 rounded-xl bg-[#FBF9F5] border border-stone-200 text-stone-900 placeholder-stone-400 text-sm"
              />
            </div>
            <div>
              <label className="block text-xs font-bold uppercase tracking-wider text-stone-500 mb-2">
                Studio Phone
              </label>
              <input
                type="text"
                value={form.phone || ''}
                onChange={(e) => setForm({ ...form, phone: e.target.value })}
                className="w-full px-4 py-3 rounded-xl bg-[#FBF9F5] border border-stone-200 text-stone-900 placeholder-stone-400 text-sm"
              />
            </div>
            <div>
              <label className="block text-xs font-bold uppercase tracking-wider text-stone-500 mb-2">
                Location / Studios
              </label>
              <input
                type="text"
                value={form.location || ''}
                onChange={(e) => setForm({ ...form, location: e.target.value })}
                className="w-full px-4 py-3 rounded-xl bg-[#FBF9F5] border border-stone-200 text-stone-900 placeholder-stone-400 text-sm"
              />
            </div>
          </div>

          <div>
            <label className="block text-xs font-bold uppercase tracking-wider text-stone-500 mb-2">
              Hero Main Heading
            </label>
            <input
              type="text"
              value={form.heroTitle || ''}
              onChange={(e) => setForm({ ...form, heroTitle: e.target.value })}
              className="w-full px-4 py-3 rounded-xl bg-[#FBF9F5] border border-stone-200 text-stone-900 placeholder-stone-400 text-sm"
            />
          </div>

          <div>
            <label className="block text-xs font-bold uppercase tracking-wider text-stone-500 mb-2">
              Hero Description
            </label>
            <textarea
              rows={3}
              value={form.heroSubtitle || ''}
              onChange={(e) => setForm({ ...form, heroSubtitle: e.target.value })}
              className="w-full px-4 py-3 rounded-xl bg-[#FBF9F5] border border-stone-200 text-stone-900 placeholder-stone-400 text-sm resize-none"
            />
          </div>

          <div className="grid sm:grid-cols-3 gap-4 pt-2 border-t border-stone-200">
            <div>
              <label className="block text-xs font-bold uppercase tracking-wider text-stone-500 mb-2">
                GitHub URL
              </label>
              <input
                type="url"
                value={form.githubUrl || ''}
                onChange={(e) => setForm({ ...form, githubUrl: e.target.value })}
                placeholder="https://github.com/..."
                className="w-full px-4 py-3 rounded-xl bg-[#FBF9F5] border border-stone-200 text-stone-900 placeholder-stone-400 text-sm"
              />
            </div>
            <div>
              <label className="block text-xs font-bold uppercase tracking-wider text-stone-500 mb-2">
                LinkedIn URL
              </label>
              <input
                type="url"
                value={form.linkedinUrl || ''}
                onChange={(e) => setForm({ ...form, linkedinUrl: e.target.value })}
                placeholder="https://www.linkedin.com/in/..."
                className="w-full px-4 py-3 rounded-xl bg-[#FBF9F5] border border-stone-200 text-stone-900 placeholder-stone-400 text-sm"
              />
            </div>
            <div>
              <label className="block text-xs font-bold uppercase tracking-wider text-stone-500 mb-2">
                Pinterest URL
              </label>
              <input
                type="url"
                value={form.pinterestUrl || ''}
                onChange={(e) => setForm({ ...form, pinterestUrl: e.target.value })}
                placeholder="https://in.pinterest.com/..."
                className="w-full px-4 py-3 rounded-xl bg-[#FBF9F5] border border-stone-200 text-stone-900 placeholder-stone-400 text-sm"
              />
            </div>
          </div>

          <button
            type="submit"
            disabled={saving}
            className="px-8 py-3.5 rounded-full bg-[#0F1715] text-white shadow-sm text-sm font-semibold hover:bg-emerald-800 transition-colors"
          >
            {saving ? 'Saving...' : 'Save Website Settings'}
          </button>

          <div className="pt-6 mt-6 border-t border-stone-200 flex flex-col sm:flex-row sm:items-center justify-between gap-4">
            <div>
              <div className={`inline-flex items-center gap-2 text-xs font-mono font-bold uppercase tracking-wider ${isSupabaseConfigured() ? 'text-emerald-700' : 'text-amber-700'}`}>
                <span className={`w-2 h-2 rounded-full animate-pulse ${isSupabaseConfigured() ? 'bg-emerald-600' : 'bg-amber-500'}`} />
                <span>{isSupabaseConfigured() ? 'Supabase Cloud Sync Active (Multi-Device)' : 'Supabase Keys Needed in SUPABASE_CONFIG'}</span>
              </div>
              <p className="text-xs text-stone-500 mt-1">
                {isSupabaseConfigured()
                  ? 'Projects, images, APK/ISO release files, and messages sync automatically across all computers and phones.'
                  : 'Paste your free Supabase Project URL and Anon Key into SUPABASE_CONFIG inside the HTML file to enable cross-device sync.'}
              </p>
            </div>
            <div className="flex flex-wrap items-center gap-2.5 shrink-0">
              <button
                type="button"
                onClick={async () => {
                  const json = await WebTrexDB.exportBackupJson();
                  const blob = new Blob([json], { type: 'application/json' });
                  const url = URL.createObjectURL(blob);
                  const a = document.createElement('a');
                  a.href = url;
                  a.download = `webtrex-db-backup-${new Date().toISOString().split('T')[0]}.json`;
                  document.body.appendChild(a);
                  a.click();
                  document.body.removeChild(a);
                  URL.revokeObjectURL(url);
                  recordActivity('Database Exported', 'Downloaded full IndexedDB JSON snapshot.');
                  addToast('Database Exported', 'Backup JSON downloaded.');
                }}
                className="inline-flex items-center gap-1.5 px-4 py-2.5 rounded-full border border-stone-300 bg-[#FAF8F5] text-xs font-bold text-stone-800 hover:border-[#0F5132] transition-colors"
              >
                <Download className="w-3.5 h-3.5" />
                Export DB Backup
              </button>
              <label className="cursor-pointer inline-flex items-center gap-1.5 px-4 py-2.5 rounded-full border border-stone-300 bg-[#FAF8F5] text-xs font-bold text-stone-800 hover:border-[#0F5132] transition-colors">
                <Upload className="w-3.5 h-3.5" />
                Restore DB JSON
                <input
                  type="file"
                  accept=".json"
                  className="hidden"
                  onChange={async (e) => {
                    const file = e.target.files?.[0];
                    if (!file) return;
                    try {
                      const content = await file.text();
                      await WebTrexDB.importBackupJson(content);
                      recordActivity('Database Restored', `Imported backup from ${file.name}`);
                      addToast('Database Restored', 'All collections synced from backup.');
                    } catch (err) {
                      addToast('Restore Failed', err.message || 'Invalid backup file.', 'error');
                    }
                    e.target.value = '';
                  }}
                />
              </label>
            </div>
          </div>
        </form>
      );
    }

    // ========================================================================
    // ADMIN TAB 8: ADMIN PROFILE & SECURE PASSWORD ROTATION
    // ========================================================================
    function AdminProfileTab({
      adminSession,
      setAdminSession,
      addToast,
      recordActivity,
    }) {
      const [name, setName] = useState(adminSession.name);
      const [currentPassword, setCurrentPassword] = useState('');
      const [newPassword, setNewPassword] = useState('');
      const [confirmPassword, setConfirmPassword] = useState('');
      const [updating, setUpdating] = useState(false);

      const handlePasswordChange = async (e) => {
        e.preventDefault();
        if (newPassword.length < 8) {
          addToast('Weak Password', 'New password must be at least 8 characters.', 'error');
          return;
        }
        if (newPassword !== confirmPassword) {
          addToast('Mismatch', 'New password and confirmation do not match.', 'error');
          return;
        }

        setUpdating(true);
        try {
          const data = Store.read(STORAGE_KEYS.ADMIN, {});
          const defaultHash = await getExpectedDefaultHash();
          const existingHash = data.passwordHash || defaultHash;

          const verifyCurrent = data.salt
            ? await computeSaltedHash(currentPassword, data.salt)
            : await computeSaltedHash(currentPassword);
          if (verifyCurrent !== existingHash) {
            addToast('Verification Failed', 'Current administrator password is incorrect.', 'error');
            setUpdating(false);
            return;
          }

          const newSalt = `WTX_SALT_${Date.now()}`;
          const newHash = await computeSaltedHash(newPassword, newSalt);

          Store.write(STORAGE_KEYS.ADMIN, {
            ...data,
            name: name.trim(),
            email: adminSession.email,
            salt: newSalt,
            passwordHash: newHash,
            passwordUpdatedAt: new Date().toISOString(),
            updatedAt: new Date().toISOString(),
          });

          setAdminSession({ ...adminSession, name: name.trim() });
          recordActivity('Admin Credentials Updated', 'Administrator rotated password hash.');
          addToast('Security Updated', 'Administrator password has been updated securely.');
          setCurrentPassword('');
          setNewPassword('');
          setConfirmPassword('');
        } finally {
          setUpdating(false);
        }
      };

      return (
        <div className="max-w-2xl bg-white rounded-3xl border border-stone-200/90 shadow-sm p-6 sm:p-9 space-y-6">
          <div>
            <h3 className="text-lg font-bold text-stone-900">Administrator Account & Security</h3>
            <p className="text-xs text-stone-500 mt-1">
              Passwords are cryptographically salted and hashed with SHA-256 before persistence.
            </p>
          </div>

          <form onSubmit={handlePasswordChange} className="space-y-4">
            <div>
              <label className="block text-xs font-bold uppercase tracking-wider text-stone-500 mb-2">
                Display Name
              </label>
              <input
                type="text"
                value={name}
                onChange={(e) => setName(e.target.value)}
                className="w-full px-4 py-3 rounded-xl bg-[#FBF9F5] border border-stone-200 text-stone-900 placeholder-stone-400 text-sm"
              />
            </div>

            <div>
              <label className="block text-xs font-bold uppercase tracking-wider text-stone-500 mb-2">
                Administrator Email (Login ID)
              </label>
              <input
                type="email"
                disabled
                value={adminSession.email}
                className="w-full px-4 py-3 rounded-xl bg-stone-100 border border-stone-200 text-sm text-stone-400"
              />
            </div>

            <div className="pt-4 border-t border-stone-200 space-y-4">
              <p className="text-xs font-bold uppercase tracking-wider text-emerald-700">
                Change Administrator Password
              </p>
              <div>
                <label className="block text-xs font-bold text-stone-500 mb-1.5">
                  Current Password
                </label>
                <input
                  type="password"
                  required
                  value={currentPassword}
                  onChange={(e) => setCurrentPassword(e.target.value)}
                  className="w-full px-4 py-3 rounded-xl bg-[#FBF9F5] border border-stone-200 text-stone-900 placeholder-stone-400 text-sm"
                />
              </div>
              <div className="grid sm:grid-cols-2 gap-4">
                <div>
                  <label className="block text-xs font-bold text-stone-500 mb-1.5">
                    New Password
                  </label>
                  <input
                    type="password"
                    required
                    value={newPassword}
                    onChange={(e) => setNewPassword(e.target.value)}
                    className="w-full px-4 py-3 rounded-xl bg-[#FBF9F5] border border-stone-200 text-stone-900 placeholder-stone-400 text-sm"
                  />
                </div>
                <div>
                  <label className="block text-xs font-bold text-stone-500 mb-1.5">
                    Confirm New Password
                  </label>
                  <input
                    type="password"
                    required
                    value={confirmPassword}
                    onChange={(e) => setConfirmPassword(e.target.value)}
                    className="w-full px-4 py-3 rounded-xl bg-[#FBF9F5] border border-stone-200 text-stone-900 placeholder-stone-400 text-sm"
                  />
                </div>
              </div>
            </div>

            <button
              type="submit"
              disabled={updating}
              className="px-7 py-3.5 rounded-full bg-[#0F1715] text-white shadow-sm text-sm font-semibold hover:bg-emerald-800 transition-colors"
            >
              {updating ? 'Updating Credentials...' : 'Update Password & Profile'}
            </button>
          </form>
        </div>
      );
    }



    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
