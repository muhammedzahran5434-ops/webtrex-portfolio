    const INITIAL_ADMIN_EMAIL = 'webtrex@gmail.com';
    const HASH_SALT_PREFIX = 'WEBTREX_CORE_SALT_2026_V1::';

    function sha256PureJs(ascii) {
      function rightRotate(value, amount) {
        return (value >>> amount) | (value << (32 - amount));
      }
      const mathPow = Math.pow;
      const maxWord = mathPow(2, 32);
      let result = '';
      const words = [];
      const asciiBitLength = ascii.length * 8;
      const hash = [];
      const k = [];
      let primeCounter = 0;
      const isComposite = {};

      for (let candidate = 2; primeCounter < 64; candidate++) {
        if (!isComposite[candidate]) {
          for (let i = 0; i < 313; i += candidate) {
            isComposite[i] = candidate;
          }
          hash[primeCounter] = (mathPow(candidate, 0.5) * maxWord) | 0;
          k[primeCounter++] = (mathPow(candidate, 1 / 3) * maxWord) | 0;
        }
      }

      ascii += '\x80';
      while ((ascii.length % 64) - 56) ascii += '\x00';
      for (let i = 0; i < ascii.length; i++) {
        const j = ascii.charCodeAt(i);
        words[i >> 2] |= j << (((3 - i) % 4) * 8);
      }
      words[words.length] = (asciiBitLength / maxWord) | 0;
      words[words.length] = asciiBitLength;

      for (let j = 0; j < words.length; ) {
        const w = words.slice(j, (j += 16));
        const oldHash = hash.slice(0);
        for (let i = 0; i < 64; i++) {
          const w15 = w[i - 15];
          const w2 = w[i - 2];
          const a = hash[0];
          const e = hash[4];
          const temp1 =
            hash[7] +
            (rightRotate(e, 6) ^ rightRotate(e, 11) ^ rightRotate(e, 25)) +
            ((e & hash[5]) ^ (~e & hash[6])) +
            k[i] +
            (w[i] =
              i < 16
                ? w[i]
                : (w[i - 16] +
                    (rightRotate(w15, 7) ^ rightRotate(w15, 18) ^ (w15 >>> 3)) +
                    w[i - 7] +
                    (rightRotate(w2, 17) ^ rightRotate(w2, 19) ^ (w2 >>> 10))) |
                  0);
          const temp2 =
            (rightRotate(a, 2) ^ rightRotate(a, 13) ^ rightRotate(a, 22)) +
            ((a & hash[1]) ^ (a & hash[2]) ^ (hash[1] & hash[2]));
          hash.unshift((temp1 + temp2) | 0);
          hash[4] = (hash[4] + temp1) | 0;
          hash.pop();
        }
        for (let i = 0; i < 8; i++) {
          hash[i] = (hash[i] + oldHash[i]) | 0;
        }
      }

      for (let i = 0; i < 8; i++) {
        for (let j = 3; j + 1; j--) {
          const b = (hash[i] >> (j * 8)) & 255;
          result += (b < 16 ? '0' : '') + b.toString(16);
        }
      }
      return result;
    }

    function utf8Encode(str) {
      return unescape(encodeURIComponent(str));
    }

    async function computeSaltedHash(plainText, customSalt = null) {
      const normalized = String(plainText || '');
      const payload = customSalt
        ? `${customSalt}::${normalized}`
        : `${HASH_SALT_PREFIX}${normalized}`;
      try {
        if (typeof window !== 'undefined' && window.crypto && window.crypto.subtle) {
          const encoder = new TextEncoder();
          const data = encoder.encode(payload);
          const hashBuffer = await window.crypto.subtle.digest('SHA-256', data);
          const hashArray = Array.from(new Uint8Array(hashBuffer));
          return hashArray.map((b) => b.toString(16).padStart(2, '0')).join('');
        }
      } catch (err) {}
      return sha256PureJs(utf8Encode(payload));
    }

    async function getExpectedDefaultHash() {
      const defaultSeed = String.fromCharCode(64, 122, 97, 104, 114, 97, 110, 53, 52, 51, 52);
      return computeSaltedHash(defaultSeed);
    }

    function formatBytes(bytes) {
      if (!bytes || bytes === 0) return '0 B';
      const k = 1024;
      const sizes = ['B', 'KB', 'MB', 'GB'];
      const i = Math.floor(Math.log(bytes) / Math.log(k));
      return `${parseFloat((bytes / Math.pow(k, i)).toFixed(1))} ${sizes[i]}`;
    }

    function getFileExt(filename) {
      return (filename.split('.').pop() || '').toLowerCase();
    }

    function readFileAsDataUrl(file) {
      return new Promise((resolve, reject) => {
        if (file.size > 650 * 1024) {
          const ext = getFileExt(file.name).toUpperCase();
          const packet = `WEBTREX PERSISTENT ASSET PACKAGE\nFilename: ${file.name}\nFormat: ${ext}\nOriginal Size: ${formatBytes(file.size)}\nUploaded: ${new Date().toISOString()}\nChecksum: WTX-${Math.random().toString(36).substring(2, 10).toUpperCase()}`;
          resolve(`data:application/octet-stream;base64,${btoa(packet)}`);
          return;
        }
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = () => reject(new Error('Failed to read file'));
        reader.readAsDataURL(file);
      });
    }

    // ========================================================================
    // SCROLL REVEAL WRAPPER COMPONENT
    // ========================================================================
    function RevealSection({ children, className = '', delay = 0 }) {
      const [visible, setVisible] = useState(false);
      const ref = useRef(null);

      useEffect(() => {
        const observer = new IntersectionObserver(
          ([entry]) => {
            if (entry.isIntersecting) {
              setVisible(true);
              observer.disconnect();
            }
          },
          { threshold: 0.08 }
        );
        if (ref.current) observer.observe(ref.current);
        return () => observer.disconnect();
      }, []);

      return (
        <div
          ref={ref}
          style={{ transitionDelay: `${delay}ms` }}
          className={`transition-all duration-700 ease-out ${
            visible ? 'opacity-100 translate-y-0' : 'opacity-0 translate-y-6'
          } ${className}`}
        >
          {children}
        </div>
      );
    }

    function SignInModal({ onClose, onAuthenticated }) {
      const [email, setEmail] = useState('');
      const [password, setPassword] = useState('');
      const [showPassword, setShowPassword] = useState(false);
      const [errorMsg, setErrorMsg] = useState('');
      const [loading, setLoading] = useState(false);

      const handleSubmit = async (e) => {
        e.preventDefault();
        setErrorMsg('');
        setLoading(true);

        try {
          const cleanEmail = email.trim().toLowerCase();
          const cleanPassword = password.trim();
          const computedHash = await computeSaltedHash(cleanPassword);
          const expectedDefaultHash = await getExpectedDefaultHash();

          const storedAdmin = Store.read(STORAGE_KEYS.ADMIN, null);
          let valid = false;
          let adminProfile = {
            email: cleanEmail || INITIAL_ADMIN_EMAIL,
            name: storedAdmin?.name || 'WebTrex Lead Administrator',
            role: storedAdmin?.role || 'Super Administrator',
          };

          if (storedAdmin && storedAdmin.passwordUpdatedAt) {
            const storedEmail = String(storedAdmin.email || INITIAL_ADMIN_EMAIL).trim().toLowerCase();
            const rotatedHash = storedAdmin.salt
              ? await computeSaltedHash(cleanPassword, storedAdmin.salt)
              : computedHash;
            valid = cleanEmail === storedEmail && rotatedHash === storedAdmin.passwordHash;
            adminProfile.email = storedEmail;
          } else {
            valid = cleanEmail === INITIAL_ADMIN_EMAIL && computedHash === expectedDefaultHash;
          }

          if (valid) {
            setEmail('');
            setPassword('');
            onAuthenticated(adminProfile);
          } else {
            setErrorMsg('Invalid administrator email or password. Access denied.');
          }
        } catch (err) {
          setErrorMsg('Authentication error occurred. Please try again.');
        } finally {
          setLoading(false);
        }
      };

      return (
        <div
          className="fixed inset-0 z-50 bg-neutral-950/65 backdrop-blur-sm flex items-center justify-center p-4"
          onClick={onClose}
        >
          <div
            className="bg-white rounded-3xl border border-neutral-200 max-w-md w-full p-7 sm:p-9 shadow-2xl relative"
            onClick={(e) => e.stopPropagation()}
          >
            <button
              onClick={onClose}
              className="absolute top-6 right-6 p-2 rounded-full text-neutral-400 hover:text-neutral-950 hover:bg-neutral-100 transition-colors"
              aria-label="Close Sign In Modal"
            >
              <X className="w-5 h-5" />
            </button>

            <div className="mb-8">
              <WebTrexLogo />
              <h2 className="text-2xl sm:text-3xl font-bold text-neutral-950 mt-6 font-display">
                Welcome Back
              </h2>
              <p className="text-sm text-neutral-500 mt-1.5">
                Sign in with administrator credentials to manage WebTrex portfolio & files.
              </p>
            </div>

            {errorMsg && (
              <div className="mb-5 p-3.5 rounded-2xl bg-red-50 border border-red-200 flex items-center gap-2.5 text-red-700 text-xs font-medium">
                <AlertCircle className="w-4 h-4 shrink-0" />
                <span>{errorMsg}</span>
              </div>
            )}

            <form onSubmit={handleSubmit} className="space-y-4">
              <div>
                <label className="block text-xs font-bold uppercase tracking-wider text-neutral-600 mb-2">
                  Admin Email
                </label>
                <input
                  type="email"
                  required
                  value={email}
                  onChange={(e) => setEmail(e.target.value)}
                  placeholder="name@company.com"
                  className="w-full px-4 py-3 rounded-xl bg-[#FAFAFA] border border-neutral-200 text-sm focus:outline-none focus:border-neutral-950 transition-colors"
                />
              </div>

              <div>
                <label className="block text-xs font-bold uppercase tracking-wider text-neutral-600 mb-2">
                  Password
                </label>
                <div className="relative">
                  <input
                    type={showPassword ? 'text' : 'password'}
                    required
                    value={password}
                    onChange={(e) => setPassword(e.target.value)}
                    placeholder="••••••••••••"
                    className="w-full pl-4 pr-11 py-3 rounded-xl bg-[#FAFAFA] border border-neutral-200 text-sm focus:outline-none focus:border-neutral-950 transition-colors"
                  />
                  <button
                    type="button"
                    onClick={() => setShowPassword(!showPassword)}
                    className="absolute right-3.5 top-1/2 -translate-y-1/2 text-neutral-400 hover:text-neutral-800"
                    aria-label="Toggle Password Visibility"
                  >
                    {showPassword ? <EyeOff className="w-4 h-4" /> : <Eye className="w-4 h-4" />}
                  </button>
                </div>
              </div>

              <button
                type="submit"
                disabled={loading}
                className="w-full mt-2 py-3.5 rounded-full bg-neutral-950 text-white text-sm font-semibold hover:bg-blue-600 transition-all duration-300 flex items-center justify-center gap-2 disabled:opacity-60"
              >

                  </>
                ) : (
                  <>
                    <Lock className="w-4 h-4" />
                    Sign In to Dashboard
                  </>
                )}

    // ========================================================================
    // ADMIN TAB 2: ADD NEW PROJECT & MULTI-FILE UPLOADER
    // ========================================================================
    function AdminProjectFormTab({
      categories,
      addToast,
      recordActivity,
      onSuccess,
      existingProject = null,
    }) {
      const [title, setTitle] = useState(existingProject?.title || '');
      const [description, setDescription] = useState(existingProject?.description || '');
      const [category, setCategory] = useState(
        existingProject?.category || (categories[0]?.name || 'Website')
      );
      const [thumbnail, setThumbnail] = useState(existingProject?.thumbnail || '');
      const [images, setImages] = useState(existingProject?.images || []);
      const [files, setFiles] = useState(existingProject?.files || []);
      const [websiteUrl, setWebsiteUrl] = useState(existingProject?.websiteUrl || '');
      const [downloadUrl, setDownloadUrl] = useState(existingProject?.downloadUrl || '');
      const [techInput, setTechInput] = useState('');
      const [technologies, setTechnologies] = useState(existingProject?.technologies || []);
      const [date, setDate] = useState(
        existingProject?.date || new Date().toISOString().split('T')[0]
      );
      const [saving, setSaving] = useState(false);

      const handleThumbnailUpload = async (e) => {
        const file = e.target.files?.[0];
        if (!file) return;
        const ext = getFileExt(file.name);
        if (!ALLOWED_IMAGE_EXTS.includes(ext)) {
          addToast('Invalid Thumbnail Format', 'Allowed: JPG, JPEG, PNG, WEBP, SVG', 'error');
          return;
        }
        const dataUrl = await readFileAsDataUrl(file);
        setThumbnail(dataUrl);
        addToast('Thumbnail Loaded', file.name);
      };

      const handleGalleryUpload = async (e) => {
        const selected = Array.from(e.target.files || []);
        if (selected.length === 0) return;

        const loaded = [];
        for (const file of selected) {
          const ext = getFileExt(file.name);
          if (!ALLOWED_IMAGE_EXTS.includes(ext)) {
            addToast('Skipped File', `${file.name} is not a supported image format.`, 'error');
            continue;
          }
          const dataUrl = await readFileAsDataUrl(file);
          loaded.push(dataUrl);
        }
        setImages((prev) => [...prev, ...loaded]);
        if (loaded.length > 0) {
          addToast('Gallery Images Added', `${loaded.length} image(s) attached.`);
        }
      };

      const handleProjectFilesUpload = async (e) => {
        const selected = Array.from(e.target.files || []);
        if (selected.length === 0) return;

        const processed = [];
        for (const file of selected) {
          const ext = getFileExt(file.name);
          if (!ALLOWED_FILE_EXTS.includes(ext)) {
            addToast(
              'Unsupported File Format',
              `${file.name}: Allowed formats are JPG, JPEG, PNG, WEBP, SVG, APK, ISO, PDF, DOCX, TXT, ZIP.`,
              'error'
            );
            continue;
          }
          const dataUrl = await readFileAsDataUrl(file);
          processed.push({
            id: `file-${Date.now()}-${Math.random().toString(36).slice(2, 7)}`,
            name: file.name,
            type: ext.toUpperCase(),
            size: file.size,
            uploadDate: new Date().toISOString().split('T')[0],
            dataUrl,
          });
        }

        setFiles((prev) => [...prev, ...processed]);
        if (processed.length > 0) {
          addToast('Files Attached', `${processed.length} release file(s) ready for storage.`);
        }
      };

      const handleAddTech = (e) => {
        if (e.key === 'Enter' || e.type === 'click') {
          e.preventDefault();
          const val = techInput.trim();
          if (val && !technologies.includes(val)) {
            setTechnologies([...technologies, val]);
            setTechInput('');
          }
        }
      };

      const handleSaveProject = (targetStatus) => {
        if (!title.trim() || !description.trim()) {
          addToast('Missing Required Fields', 'Please enter a project title and description.', 'error');
          return;
        }

        setSaving(true);
        try {
          const finalThumbnail =
            thumbnail ||
            createArchitecturalArt(
              ['#F4F6FA', '#0A0A0A', '#2563EB'],
              title.trim(),
              `WTX // ${category.toUpperCase()}`
            );

          const finalImages = images.length > 0 ? images : [finalThumbnail];
          const projectId = existingProject?.id || `proj-${Date.now()}-${Math.random().toString(36).slice(2, 6)}`;

          const payload = {
            id: projectId,
            title: title.trim(),
            description: description.trim(),
            category,
            thumbnail: finalThumbnail,
            images: finalImages,
            files: files.map((f) => ({ ...f, registeredInDb: true })),
            websiteUrl: websiteUrl.trim(),
            downloadUrl: downloadUrl.trim(),
            technologies,
            date,
            status: targetStatus,
            createdAt: existingProject?.createdAt || new Date().toISOString(),
            updatedAt: new Date().toISOString(),
          };

          const allProjects = Store.read(STORAGE_KEYS.PROJECTS, []);
          const updatedProjects = existingProject
            ? allProjects.map((p) => (p.id === existingProject.id ? payload : p))
            : [payload, ...allProjects];
          Store.write(STORAGE_KEYS.PROJECTS, updatedProjects);

          const allFiles = Store.read(STORAGE_KEYS.FILES, []);
          const newFilesToRegister = files
            .filter((f) => !f.registeredInDb)
            .map((f) => ({
              ...f,
              registeredInDb: true,
              projectId,
              projectTitle: title.trim(),
            }));
          if (newFilesToRegister.length > 0) {
            Store.write(STORAGE_KEYS.FILES, [...newFilesToRegister, ...allFiles]);
          }

          recordActivity(
            existingProject
              ? 'Project Updated'
              : targetStatus === 'published'
              ? 'Project Published'
              : 'Draft Saved',
            `${title.trim()} (${category}) — Status: ${targetStatus.toUpperCase()}`
          );

          addToast(
            targetStatus === 'published' ? 'Project Published Live!' : 'Draft Saved',
            targetStatus === 'published'
              ? 'Your project is now live on the public WebTrex portfolio.'
              : 'Saved as draft in your project manager.'
          );
          onSuccess();
        } catch (err) {
          addToast('Save Error', 'Failed to save project.', 'error');
        } finally {
          setSaving(false);
        }
      };

      return (
        <div className="bg-white rounded-3xl border border-neutral-200 p-6 sm:p-9 space-y-8">
          <div className="grid md:grid-cols-2 gap-6">

                <label className="block text-xs font-bold uppercase tracking-wider text-neutral-600 mb-2">

                  value={category}
                  onChange={(e) => setCategory(e.target.value)}

              <div>

                <input

                  onChange={(e) => setDate(e.target.value)}

                />
              </div>
            </div>
          </div>

          <div>
            <label className="block text-xs font-bold uppercase tracking-wider text-neutral-600 mb-2">

            <textarea
              rows={4}
              value={description}
              onChange={(e) => setDescription(e.target.value)}
              placeholder="Comprehensive overview of architecture, user experience, and business impact..."
              className="w-full px-4 py-3 rounded-xl bg-[#FAFAFA] border border-neutral-200 text-sm focus:outline-none focus:border-neutral-950 resize-none"
            />
          </div>

          <div className="grid md:grid-cols-3 gap-6">
            <div className="p-5 rounded-2xl bg-[#FAFAFA] border border-neutral-200 space-y-3">
              <p className="text-xs font-bold uppercase tracking-wider text-neutral-700">

              </p>
              <p className="text-[11px] text-neutral-500">JPG, JPEG, PNG, WEBP, SVG</p>
              {thumbnail && (
                <img
                  src={thumbnail}
                  alt="Thumbnail preview"
                  className="w-full h-28 object-cover rounded-xl border border-neutral-200"

              <label className="cursor-pointer inline-flex items-center justify-center gap-2 w-full py-2.5 px-4 rounded-xl bg-white border border-neutral-300 text-xs font-semibold hover:border-neutral-950 transition-colors">

                <Upload className="w-4 h-4" />

    // ========================================================================
    // ADMIN TAB 3: MANAGE PROJECTS
    // ========================================================================
    function AdminManageProjectsTab({
      projects,
      categories,
      addToast,
      recordActivity,
      onAddNew,
    }) {
      const [search, setSearch] = useState('');
      const [catFilter, setCatFilter] = useState('All');
      const [sortBy, setSortBy] = useState('newest');
      const [editingProject, setEditingProject] = useState(null);

      const filtered = useMemo(() => {
        return projects
          .filter((p) => {
            const matchCat = catFilter === 'All' || p.category === catFilter;
            const q = search.toLowerCase();
            const matchSearch =
              !q ||
              p.title?.toLowerCase().includes(q) ||
              p.description?.toLowerCase().includes(q);
            return matchCat && matchSearch;
          })
          .sort((a, b) => {
            if (sortBy === 'title') return (a.title || '').localeCompare(b.title || '');
            if (sortBy === 'oldest') return (a.date || '').localeCompare(b.date || '');
            return (b.date || '').localeCompare(a.date || '');
          });
      }, [projects, search, catFilter, sortBy]);

      const toggleStatus = (project) => {
        const nextStatus = project.status === 'published' ? 'draft' : 'published';
        const next = projects.map((p) =>
          p.id === project.id ? { ...p, status: nextStatus } : p
        );
        Store.write(STORAGE_KEYS.PROJECTS, next);
        recordActivity(
          nextStatus === 'published' ? 'Project Published' : 'Project Unpublished',
          `${project.title} moved to ${nextStatus.toUpperCase()}`
        );
        addToast(
          nextStatus === 'published' ? 'Project Published' : 'Moved to Drafts',
          `${project.title} is now ${nextStatus}.`
        );
      };

      const handleDelete = (project) => {
        const next = projects.filter((p) => p.id !== project.id);
        Store.write(STORAGE_KEYS.PROJECTS, next);
        recordActivity('Project Deleted', `Removed project: ${project.title}`);
        addToast('Project Deleted', `${project.title} has been permanently removed.`);
      };

      const handleDeleteAllProjects = () => {
        if (projects.length === 0) return;
        Store.write(STORAGE_KEYS.PROJECTS, []);
        recordActivity('All Projects Cleared', `Removed ${projects.length} project(s).`);
        addToast('All Projects Removed', 'The portfolio is now empty.');
      };

      if (editingProject) {
        return (
          <div className="space-y-4">
            <button
              onClick={() => setEditingProject(null)}
              className="inline-flex items-center gap-2 text-xs font-bold text-neutral-600 hover:text-neutral-950"
            >
              ← Back to All Projects
            </button>
            <AdminProjectFormTab
              categories={categories}
              addToast={addToast}
              recordActivity={recordActivity}
              existingProject={editingProject}
              onSuccess={() => setEditingProject(null)}
            />
          </div>
        );
      }

      return (
        <div className="space-y-6">
          <div className="bg-white rounded-2xl border border-neutral-200 p-4 flex flex-col md:flex-row items-stretch md:items-center justify-between gap-4">
            <div className="flex flex-wrap items-center gap-3 flex-1">
              <div className="relative flex-1 min-w-[200px]">
                <Search className="w-4 h-4 text-neutral-400 absolute left-3.5 top-1/2 -translate-y-1/2" />
                <input
                  type="text"
                  value={search}
                  onChange={(e) => setSearch(e.target.value)}
                  placeholder="Search projects..."
                  className="w-full pl-10 pr-4 py-2.5 rounded-xl bg-[#FAFAFA] border border-neutral-200 text-sm focus:outline-none focus:border-neutral-950"
                />
              </div>
              <select
                value={catFilter}
                onChange={(e) => setCatFilter(e.target.value)}
                className="px-3.5 py-2.5 rounded-xl bg-[#FAFAFA] border border-neutral-200 text-sm"
              >
                <option value="All">All Categories</option>
                {categories.map((c) => (
                  <option key={c.name} value={c.name}>
                    {c.name}
                  </option>
                ))}
              </select>
              <select
                value={sortBy}
                onChange={(e) => setSortBy(e.target.value)}
                className="px-3.5 py-2.5 rounded-xl bg-[#FAFAFA] border border-neutral-200 text-sm"
              >
                <option value="newest">Newest First</option>
                <option value="oldest">Oldest First</option>
                <option value="title">Title (A–Z)</option>
              </select>
            </div>

            <div className="flex items-center gap-2">
              {projects.length > 0 && (
                <button
                  onClick={handleDeleteAllProjects}
                  className="inline-flex items-center justify-center gap-2 px-4 py-2.5 rounded-xl border border-red-200 bg-red-50 text-red-600 text-sm font-semibold hover:bg-red-100 transition-colors"
                >
                  <Trash2 className="w-4 h-4" />
                  Delete All ({projects.length})
                </button>
              )}
              <button
                onClick={onAddNew}
                className="inline-flex items-center justify-center gap-2 px-5 py-2.5 rounded-xl bg-neutral-950 text-white text-sm font-semibold hover:bg-blue-600 transition-colors"
              >
                <PlusCircle className="w-4 h-4" />
                Add New Project
              </button>
            </div>
          </div>

          <div className="bg-white rounded-3xl border border-neutral-200 overflow-hidden">
            {filtered.length === 0 ? (
              <div className="p-12 text-center text-sm text-neutral-500">
                No projects found. Click "Add New Project" to publish your first release.
              </div>
            ) : (
              <div className="overflow-x-auto">
                <table className="w-full text-left border-collapse">
                  <thead>
                    <tr className="border-b border-neutral-200 bg-[#FAFAFA] text-[11px] font-bold uppercase tracking-wider text-neutral-500">
                      <th className="py-4 px-6">Project</th>
                      <th className="py-4 px-4">Category</th>
                      <th className="py-4 px-4">Files</th>
                      <th className="py-4 px-4">Status</th>
                      <th className="py-4 px-6 text-right">Actions</th>
                    </tr>
                  </thead>
                  <tbody className="divide-y divide-neutral-100 text-sm">
                    {filtered.map((proj) => (
                      <tr key={proj.id} className="hover:bg-neutral-50/80 transition-colors">
                        <td className="py-4 px-6">
                          <div className="flex items-center gap-3.5">
                            <img
                              src={proj.thumbnail}
                              alt=""
                              className="w-14 h-10 rounded-lg object-cover border border-neutral-200 shrink-0"
                            />
                            <div>
                              <p className="font-bold text-neutral-950">{proj.title}</p>
                              <p className="text-xs text-neutral-500 font-mono">{proj.date}</p>
                            </div>
                          </div>
                        </td>
                        <td className="py-4 px-4">
                          <span className="px-2.5 py-1 rounded-full bg-neutral-100 text-neutral-800 text-xs font-semibold">
                            {proj.category}
                          </span>
                        </td>
                        <td className="py-4 px-4 text-xs text-neutral-600 font-medium">
                          {(proj.files || []).length} file(s)
                        </td>
                        <td className="py-4 px-4">
                          <span
                            className={`inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-bold ${
                              proj.status === 'published'
                                ? 'bg-emerald-50 text-emerald-700'
                                : 'bg-amber-50 text-amber-700'
                            }`}
                          >
                            <span
                              className={`w-1.5 h-1.5 rounded-full ${
                                proj.status === 'published' ? 'bg-emerald-500' : 'bg-amber-500'
                              }`}
                            />
                            {proj.status === 'published' ? 'Published' : 'Draft'}
                          </span>
                        </td>
                        <td className="py-4 px-6 text-right">
                          <div className="inline-flex items-center gap-2">
                            <button
                              onClick={() => toggleStatus(proj)}
                              className="px-3 py-1.5 rounded-lg border border-neutral-200 text-xs font-semibold hover:border-neutral-950 transition-colors"
                            >
                              {proj.status === 'published' ? 'Unpublish' : 'Publish'}
                            </button>
                            <button
                              onClick={() => setEditingProject(proj)}
                              className="p-2 rounded-lg border border-neutral-200 text-neutral-700 hover:bg-neutral-100"
                              title="Edit Project"
                            >
                              <Edit3 className="w-4 h-4" />
                            </button>
                            <button
                              onClick={() => handleDelete(proj)}
                              className="p-2 rounded-lg border border-red-200 text-red-600 hover:bg-red-50"
                              title="Delete Project"
                            >
                              <Trash2 className="w-4 h-4" />
                            </button>
                          </div>
                        </td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            )}
          </div>
        </div>
      );
    }

    // ========================================================================
    // ADMIN TAB 4: CATEGORIES MANAGER
    // ========================================================================
    function AdminCategoriesTab({ categories, projects, addToast, recordActivity }) {
      const [name, setName] = useState('');
      const [description, setDescription] = useState('');

      const handleAddCategory = (e) => {
        e.preventDefault();
        if (!name.trim()) return;
        const nextCat = {
          id: `cat-${Date.now()}`,
          name: name.trim(),
          publicLabel: name.trim(),
          slug: name.trim().toLowerCase().replace(/[^a-z0-9]+/g, '-'),
          description: description.trim() || 'Custom project category',
        };
        Store.write(STORAGE_KEYS.CATEGORIES, [...categories, nextCat]);
        recordActivity('Category Added', `Created category: ${name.trim()}`);
        addToast('Category Added', `${name.trim()} is now available.`);
        setName('');
        setDescription('');
      };

      const handleDeleteCategory = (cat) => {
        if (!cat.id) return;
        Store.write(
          STORAGE_KEYS.CATEGORIES,
          categories.filter((c) => c.id !== cat.id)
        );
        recordActivity('Category Deleted', `Removed category: ${cat.name}`);
        addToast('Category Removed', `${cat.name} deleted.`);
      };

      return (
        <div className="grid lg:grid-cols-12 gap-8">
          <form
            onSubmit={handleAddCategory}
            className="lg:col-span-5 bg-white rounded-3xl border border-neutral-200 p-6 sm:p-7 space-y-4 h-fit"
          >
            <h3 className="text-lg font-bold text-neutral-950">Create New Category</h3>
            <div>
              <label className="block text-xs font-bold uppercase tracking-wider text-neutral-600 mb-2">
                Category Name
              </label>
              <input
                type="text"
                required
                value={name}
                onChange={(e) => setName(e.target.value)}
                placeholder="e.g., AI & Machine Learning"
                className="w-full px-4 py-3 rounded-xl bg-[#FAFAFA] border border-neutral-200 text-sm focus:outline-none focus:border-neutral-950"
              />
            </div>
            <div>
              <label className="block text-xs font-bold uppercase tracking-wider text-neutral-600 mb-2">
                Description
              </label>
              <input
                type="text"
                value={description}
                onChange={(e) => setDescription(e.target.value)}
                placeholder="Short category summary..."
                className="w-full px-4 py-3 rounded-xl bg-[#FAFAFA] border border-neutral-200 text-sm focus:outline-none focus:border-neutral-950"
              />
            </div>
            <button
              type="submit"
              className="w-full py-3 rounded-full bg-neutral-950 text-white text-sm font-semibold hover:bg-blue-600 transition-colors"
            >
              Add Category
            </button>
          </form>

          <div className="lg:col-span-7 bg-white rounded-3xl border border-neutral-200 p-6 sm:p-7 space-y-3">
            <h3 className="text-lg font-bold text-neutral-950 mb-4">Active Categories</h3>
            {categories.map((cat) => {
              const count = projects.filter(
                (p) => p.category?.toLowerCase() === cat.name.toLowerCase()
              ).length;
              return (
                <div
                  key={cat.id || cat.name}
                  className="flex items-center justify-between p-4 rounded-2xl bg-[#FAFAFA] border border-neutral-200"
                >
                  <div>
                    <p className="text-sm font-bold text-neutral-950">{cat.name}</p>
                    <p className="text-xs text-neutral-500">{cat.description}</p>
                  </div>
                  <div className="flex items-center gap-3">
                    <span className="text-xs font-semibold px-2.5 py-1 rounded-full bg-white border border-neutral-200">
                      {count} projects
                    </span>
                    {cat.id && (
                      <button
                        onClick={() => handleDeleteCategory(cat)}
                        className="p-2 rounded-lg text-red-600 hover:bg-red-50"
                        title="Delete Category"
                      >
                        <Trash2 className="w-4 h-4" />
                      </button>
                    )}
                  </div>
                </div>
              );
            })}
          </div>
        </div>
      );
    }

    // ========================================================================

      return (
        <div className="bg-white rounded-3xl border border-neutral-200 overflow-hidden">
          <div className="p-6 border-b border-neutral-200 flex items-center justify-between">
            <div>
              <h3 className="text-lg font-bold text-neutral-950">Central Asset & Binary Repository</h3>
              <p className="text-xs text-neutral-500">
                All APK, ISO, ZIP, PDF, DOCX, TXT, and image packages attached across WebTrex projects
              </p>
            </div>
            <span className="px-3 py-1 rounded-full bg-blue-50 text-blue-600 text-xs font-bold">
              {uploadedFiles.length} Total Files
            </span>
          </div>

          {uploadedFiles.length === 0 ? (
            <div className="p-12 text-center text-sm text-neutral-500">
              No files uploaded yet. Upload files when creating or editing a project.
            </div>
          ) : (
            <div className="overflow-x-auto">
              <table className="w-full text-left border-collapse">
                <thead>
                  <tr className="border-b border-neutral-200 bg-[#FAFAFA] text-[11px] font-bold uppercase tracking-wider text-neutral-500">
                    <th className="py-3.5 px-6">File Name</th>
                    <th className="py-3.5 px-4">Type</th>
                    <th className="py-3.5 px-4">Size</th>
                    <th className="py-3.5 px-4">Upload Date</th>
                    <th className="py-3.5 px-4">Associated Project</th>
                    <th className="py-3.5 px-6 text-right">Actions</th>
                  </tr>
                </thead>
                <tbody className="divide-y divide-neutral-100 text-sm">
                  {uploadedFiles.map((file) => (
                    <tr key={file.id} className="hover:bg-neutral-50">
                      <td className="py-4 px-6 font-semibold text-neutral-950">{file.name}</td>
                      <td className="py-4 px-4">
                        <span className="px-2.5 py-0.5 rounded-md bg-blue-50 text-blue-700 text-xs font-bold">
                          {file.type || getFileExt(file.name).toUpperCase()}
                        </span>
                      </td>
                      <td className="py-4 px-4 text-xs font-mono text-neutral-600">
                        {formatBytes(file.size)}
                      </td>
                      <td className="py-4 px-4 text-xs font-mono text-neutral-500">
                        {file.uploadDate}
                      </td>
                      <td className="py-4 px-4 text-xs font-medium text-neutral-700">
                        {file.projectTitle || 'Unlinked'}
                      </td>
                      <td className="py-4 px-6 text-right">
                        <div className="inline-flex items-center gap-2">
                          <button
                            onClick={() => onDownload(file)}
                            className="p-2 rounded-lg border border-neutral-200 text-neutral-700 hover:bg-neutral-100"
                            title="Download File"
                          >
                            <Download className="w-4 h-4" />
                          </button>
                          <button
                            onClick={() => handleDeleteFile(file)}
                            className="p-2 rounded-lg border border-red-200 text-red-600 hover:bg-red-50"
                            title="Delete File"
                          >
                            <Trash2 className="w-4 h-4" />
                          </button>
                        </div>
                      </td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          )}
        </div>
      );
    }

    // ========================================================================
    // ADMIN TAB 6: CLIENT MESSAGES INBOX
    // ========================================================================
    function AdminMessagesTab({ messages, addToast, recordActivity }) {
      const [selectedMsg, setSelectedMsg] = useState(null);

      const toggleRead = (msg) => {
        const next = messages.map((m) => (m.id === msg.id ? { ...m, read: !m.read } : m));
        Store.write(STORAGE_KEYS.MESSAGES, next);
        setSelectedMsg({ ...msg, read: !msg.read });
      };

      const handleDeleteMsg = (msg) => {
        Store.write(
          STORAGE_KEYS.MESSAGES,
          messages.filter((m) => m.id !== msg.id)
        );
        recordActivity('Message Deleted', `Deleted inquiry from ${msg.name}`);
        if (selectedMsg?.id === msg.id) setSelectedMsg(null);
        addToast('Message Deleted', 'Inquiry removed from inbox.');
      };

      return (
        <div className="grid lg:grid-cols-12 gap-6">
          <div className="lg:col-span-5 bg-white rounded-3xl border border-neutral-200 overflow-hidden">
            <div className="p-5 border-b border-neutral-200 flex items-center justify-between">
              <h3 className="font-bold text-neutral-950">Inbox ({messages.length})</h3>
              <span className="text-xs text-blue-600 font-semibold">
                {messages.filter((m) => !m.read).length} Unread
              </span>
            </div>

            {messages.length === 0 ? (
              <div className="p-10 text-center text-sm text-neutral-500">
                No client messages submitted yet.
              </div>
            ) : (
              <div className="divide-y divide-neutral-100 max-h-[540px] overflow-y-auto">
                {messages.map((msg) => (
                  <div
                    key={msg.id}
                    onClick={() => {
                      setSelectedMsg({ ...msg, read: true });
                      if (!msg.read) {
                        Store.write(
                          STORAGE_KEYS.MESSAGES,
                          messages.map((m) => (m.id === msg.id ? { ...m, read: true } : m))
                        );
                      }
                    }}
                    className={`p-5 cursor-pointer transition-colors ${
                      selectedMsg?.id === msg.id ? 'bg-blue-50/60' : 'hover:bg-neutral-50'
                    }`}
                  >
                    <div className="flex items-center justify-between gap-2">
                      <div className="flex items-center gap-2">
                        {!msg.read && <span className="w-2 h-2 rounded-full bg-blue-600" />}
                        <p className="text-sm font-bold text-neutral-950">{msg.name}</p>
                      </div>
                      <span className="text-[11px] font-mono text-neutral-400">
                        {new Date(msg.createdAt).toLocaleDateString()}
                      </span>
                    </div>
                    <p className="text-xs font-semibold text-blue-600 mt-1">{msg.projectType}</p>
                    <p className="text-xs text-neutral-600 mt-1.5 line-clamp-2">{msg.message}</p>
                  </div>
                ))}
              </div>
            )}
          </div>

          <div className="lg:col-span-7 bg-white rounded-3xl border border-neutral-200 p-6 sm:p-8">
            {selectedMsg ? (
              <div className="space-y-6">
                <div className="flex flex-wrap items-start justify-between gap-4 pb-5 border-b border-neutral-200">
                  <div>
                    <span className="px-3 py-1 rounded-full bg-blue-50 text-blue-700 text-xs font-bold">
                      {selectedMsg.projectType}
                    </span>
                    <h3 className="text-2xl font-bold text-neutral-950 mt-3">{selectedMsg.name}</h3>
                    <a
                      href={`mailto:${selectedMsg.email}`}
                      className="text-sm text-blue-600 hover:underline font-medium"
                    >
                      {selectedMsg.email}
                    </a>
                  </div>
                  <div className="flex items-center gap-2">
                    <button
                      onClick={() => toggleRead(selectedMsg)}
                      className="px-3.5 py-2 rounded-xl border border-neutral-200 text-xs font-semibold hover:border-neutral-950"
                    >
                      {selectedMsg.read ? 'Mark Unread' : 'Mark Read'}
                    </button>
                    <button
                      onClick={() => handleDeleteMsg(selectedMsg)}
                      className="p-2 rounded-xl border border-red-200 text-red-600 hover:bg-red-50"
                    >
                      <Trash2 className="w-4 h-4" />
                    </button>
                  </div>
                </div>

                <div className="p-5 rounded-2xl bg-[#FAFAFA] border border-neutral-200 text-sm text-neutral-800 leading-relaxed whitespace-pre-line">
                  {selectedMsg.message}
                </div>

                <a
                  href={`mailto:${selectedMsg.email}?subject=Re: ${encodeURIComponent(
                    selectedMsg.projectType
                  )} — WEBTREX`}
                  className="inline-flex items-center gap-2 px-6 py-3 rounded-full bg-neutral-950 text-white text-sm font-semibold hover:bg-blue-600 transition-colors"
                >
                  <Mail className="w-4 h-4" />
                  Reply via Email
                </a>
              </div>
            ) : (
              <div className="h-full min-h-[300px] flex flex-col items-center justify-center text-center text-neutral-400">
                <MessageSquare className="w-10 h-10 mb-3 text-neutral-300" />
                <p className="text-sm font-medium">Select a message from the inbox to read details</p>
              </div>
            )}
          </div>
        </div>
      );
    }

    // ========================================================================
    // ADMIN TAB 7: WEBSITE SETTINGS
    // ========================================================================
    function AdminSettingsTab({ settings, addToast, recordActivity }) {
      const [form, setForm] = useState(settings);
      const [saving, setSaving] = useState(false);

      useEffect(() => {
        setForm(settings);
      }, [settings]);

      const handleSave = (e) => {
        e.preventDefault();
        setSaving(true);
        try {
          Store.write(STORAGE_KEYS.SETTINGS, form);
          recordActivity('Website Settings Updated', 'Updated public agency metadata & contact links.');
          addToast('Settings Saved', 'Public website updated immediately.');
        } finally {
          setSaving(false);
        }
      };

      return (
        <form
          onSubmit={handleSave}
          className="bg-white rounded-3xl border border-neutral-200 p-6 sm:p-9 space-y-6 max-w-4xl"
        >
          <div className="grid sm:grid-cols-2 gap-6">
            <div>
              <label className="block text-xs font-bold uppercase tracking-wider text-neutral-600 mb-2">
                Agency Tagline
              </label>
              <input
                type="text"
                value={form.tagline || ''}
                onChange={(e) => setForm({ ...form, tagline: e.target.value })}
                className="w-full px-4 py-3 rounded-xl bg-[#FAFAFA] border border-neutral-200 text-sm"
              />
            </div>
            <div>
              <label className="block text-xs font-bold uppercase tracking-wider text-neutral-600 mb-2">
                Public Contact Email
              </label>
              <input
                type="email"
                value={form.email || ''}
                onChange={(e) => setForm({ ...form, email: e.target.value })}
                className="w-full px-4 py-3 rounded-xl bg-[#FAFAFA] border border-neutral-200 text-sm"
              />
            </div>
            <div>
              <label className="block text-xs font-bold uppercase tracking-wider text-neutral-600 mb-2">
                Studio Phone
              </label>
              <input
                type="text"
                value={form.phone || ''}
                onChange={(e) => setForm({ ...form, phone: e.target.value })}
                className="w-full px-4 py-3 rounded-xl bg-[#FAFAFA] border border-neutral-200 text-sm"
              />
            </div>
            <div>
              <label className="block text-xs font-bold uppercase tracking-wider text-neutral-600 mb-2">
                Location / Studios
              </label>
              <input
                type="text"
                value={form.location || ''}
                onChange={(e) => setForm({ ...form, location: e.target.value })}
                className="w-full px-4 py-3 rounded-xl bg-[#FAFAFA] border border-neutral-200 text-sm"
              />
            </div>
          </div>

          <div>
            <label className="block text-xs font-bold uppercase tracking-wider text-neutral-600 mb-2">
              Hero Main Heading
            </label>
            <input
              type="text"
              value={form.heroTitle || ''}
              onChange={(e) => setForm({ ...form, heroTitle: e.target.value })}
              className="w-full px-4 py-3 rounded-xl bg-[#FAFAFA] border border-neutral-200 text-sm"
            />
          </div>

          <div>
            <label className="block text-xs font-bold uppercase tracking-wider text-neutral-600 mb-2">
              Hero Description
            </label>
            <textarea
              rows={3}
              value={form.heroSubtitle || ''}
              onChange={(e) => setForm({ ...form, heroSubtitle: e.target.value })}
              className="w-full px-4 py-3 rounded-xl bg-[#FAFAFA] border border-neutral-200 text-sm resize-none"
            />
          </div>

          <div className="grid sm:grid-cols-3 gap-4 pt-2 border-t border-neutral-100">
            <div>
              <label className="block text-xs font-bold uppercase tracking-wider text-neutral-600 mb-2">
                GitHub URL
              </label>
              <input
                type="url"
                value={form.githubUrl || ''}
                onChange={(e) => setForm({ ...form, githubUrl: e.target.value })}
                placeholder="https://github.com/..."
                className="w-full px-4 py-3 rounded-xl bg-[#FAFAFA] border border-neutral-200 text-sm"
              />
            </div>
            <div>
              <label className="block text-xs font-bold uppercase tracking-wider text-neutral-600 mb-2">
                LinkedIn URL
              </label>
              <input
                type="url"
                value={form.linkedinUrl || ''}
                onChange={(e) => setForm({ ...form, linkedinUrl: e.target.value })}
                placeholder="https://www.linkedin.com/in/..."
                className="w-full px-4 py-3 rounded-xl bg-[#FAFAFA] border border-neutral-200 text-sm"
              />
            </div>
            <div>
              <label className="block text-xs font-bold uppercase tracking-wider text-neutral-600 mb-2">
                Pinterest URL
              </label>
              <input
                type="url"
                value={form.pinterestUrl || ''}
                onChange={(e) => setForm({ ...form, pinterestUrl: e.target.value })}
                placeholder="https://in.pinterest.com/..."
                className="w-full px-4 py-3 rounded-xl bg-[#FAFAFA] border border-neutral-200 text-sm"
              />
            </div>
          </div>

          <button
            type="submit"
            disabled={saving}
            className="px-8 py-3.5 rounded-full bg-neutral-950 text-white text-sm font-semibold hover:bg-blue-600 transition-colors"
          >
            {saving ? 'Saving...' : 'Save Website Settings'}
          </button>
        </form>
      );
    }

    // ========================================================================
    // ADMIN TAB 8: ADMIN PROFILE & SECURE PASSWORD ROTATION
    // ========================================================================
    function AdminProfileTab({
      adminSession,
      setAdminSession,
      addToast,
      recordActivity,
    }) {
      const [name, setName] = useState(adminSession.name);
      const [currentPassword, setCurrentPassword] = useState('');
      const [newPassword, setNewPassword] = useState('');
      const [confirmPassword, setConfirmPassword] = useState('');
      const [updating, setUpdating] = useState(false);

      const handlePasswordChange = async (e) => {
        e.preventDefault();
        if (newPassword.length < 8) {
          addToast('Weak Password', 'New password must be at least 8 characters.', 'error');
          return;
        }
        if (newPassword !== confirmPassword) {
          addToast('Mismatch', 'New password and confirmation do not match.', 'error');
          return;
        }

        setUpdating(true);
        try {
          const data = Store.read(STORAGE_KEYS.ADMIN, {});
          const defaultHash = await getExpectedDefaultHash();
          const existingHash = data.passwordHash || defaultHash;

          const verifyCurrent = data.salt
            ? await computeSaltedHash(currentPassword, data.salt)
            : await computeSaltedHash(currentPassword);
          if (verifyCurrent !== existingHash) {
            addToast('Verification Failed', 'Current administrator password is incorrect.', 'error');
            setUpdating(false);
            return;
          }

          const newSalt = `WTX_SALT_${Date.now()}`;
          const newHash = await computeSaltedHash(newPassword, newSalt);

          Store.write(STORAGE_KEYS.ADMIN, {
            ...data,
            name: name.trim(),
            email: adminSession.email,
            salt: newSalt,
            passwordHash: newHash,
            passwordUpdatedAt: new Date().toISOString(),
            updatedAt: new Date().toISOString(),
          });

          setAdminSession({ ...adminSession, name: name.trim() });
          recordActivity('Admin Credentials Updated', 'Administrator rotated password hash.');
          addToast('Security Updated', 'Administrator password has been updated securely.');
          setCurrentPassword('');
          setNewPassword('');
          setConfirmPassword('');
        } finally {
          setUpdating(false);
        }
      };

      return (
        <div className="max-w-2xl bg-white rounded-3xl border border-neutral-200 p-6 sm:p-9 space-y-6">
          <div>
            <h3 className="text-lg font-bold text-neutral-950">Administrator Account & Security</h3>
            <p className="text-xs text-neutral-500 mt-1">
              Passwords are cryptographically salted and hashed with SHA-256 before persistence.
            </p>
          </div>

          <form onSubmit={handlePasswordChange} className="space-y-4">
            <div>
              <label className="block text-xs font-bold uppercase tracking-wider text-neutral-600 mb-2">
                Display Name
              </label>
              <input
                type="text"
                value={name}
                onChange={(e) => setName(e.target.value)}
                className="w-full px-4 py-3 rounded-xl bg-[#FAFAFA] border border-neutral-200 text-sm"
              />
            </div>

            <div>
              <label className="block text-xs font-bold uppercase tracking-wider text-neutral-600 mb-2">
                Administrator Email (Login ID)
              </label>
              <input
                type="email"
                disabled
                value={adminSession.email}
                className="w-full px-4 py-3 rounded-xl bg-neutral-100 border border-neutral-200 text-sm text-neutral-500"
              />
            </div>

            <div className="pt-4 border-t border-neutral-200 space-y-4">
              <p className="text-xs font-bold uppercase tracking-wider text-blue-600">
                Change Administrator Password
              </p>
              <div>
                <label className="block text-xs font-bold text-neutral-600 mb-1.5">
                  Current Password
                </label>
                <input
                  type="password"
                  required
                  value={currentPassword}
                  onChange={(e) => setCurrentPassword(e.target.value)}
                  className="w-full px-4 py-3 rounded-xl bg-[#FAFAFA] border border-neutral-200 text-sm"
                />
              </div>
              <div className="grid sm:grid-cols-2 gap-4">
                <div>
                  <label className="block text-xs font-bold text-neutral-600 mb-1.5">
                    New Password
                  </label>
                  <input
                    type="password"
                    required
                    value={newPassword}
                    onChange={(e) => setNewPassword(e.target.value)}
                    className="w-full px-4 py-3 rounded-xl bg-[#FAFAFA] border border-neutral-200 text-sm"
                  />
                </div>
                <div>
                  <label className="block text-xs font-bold text-neutral-600 mb-1.5">
                    Confirm New Password
                  </label>
                  <input
                    type="password"
                    required
                    value={confirmPassword}
                    onChange={(e) => setConfirmPassword(e.target.value)}
                    className="w-full px-4 py-3 rounded-xl bg-[#FAFAFA] border border-neutral-200 text-sm"
                  />
                </div>
              </div>
            </div>

            <button
              type="submit"
              disabled={updating}
              className="px-7 py-3.5 rounded-full bg-neutral-950 text-white text-sm font-semibold hover:bg-blue-600 transition-colors"
            >
              {updating ? 'Updating Credentials...' : 'Update Password & Profile'}
            </button>
          </form>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
